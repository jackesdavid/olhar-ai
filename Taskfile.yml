# Task runner (https://taskfile.dev) for Sentinel: the SvelteKit web app in ./sentinel-app
# plus the cloud services (control/gateway/flow) and the on-prem edge. Install Task:
# `brew install go-task`. Run `task` to list, `task dev` for the web dev server.
version: "3"

# Load secrets from the gitignored root .env (ANTHROPIC_API_KEY, ELEVENLABS_*,
# TELEGRAM_*). Copy .env.example → .env and fill it in.
dotenv: [".env"]

vars:
  APP: sentinel-app # the web app directory

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: One-shot — fetch & install ALL deps (npm + Rust crates + go2rtc sidecar)
    cmds:
      - task: install
      - cargo fetch
      - task: fetch-go2rtc
      - cmd: echo "✅ Setup complete. Run 'task doctor' to check system tools, then 'task dev'."
        silent: true

  install:
    desc: Install the web app's frontend dependencies (npm)
    dir: "{{.APP}}"
    cmds:
      - npm install

  fetch-go2rtc:
    desc: Download the go2rtc live-video sidecar into ./bin (for local `task edge`; skips if present)
    status:
      - test -x bin/go2rtc
    cmds:
      - |
        set -e
        mkdir -p bin
        os=$(uname -s); arch=$(uname -m)
        # NOTE: macOS assets are .zip (extract the binary); Linux assets are bare.
        case "$os-$arch" in
          Darwin-arm64)               asset=go2rtc_mac_arm64.zip ;;
          Darwin-x86_64)              asset=go2rtc_mac_amd64.zip ;;
          Linux-x86_64)               asset=go2rtc_linux_amd64 ;;
          Linux-aarch64|Linux-arm64)  asset=go2rtc_linux_arm64 ;;
          *) echo "Unsupported $os-$arch — fetch go2rtc manually"; exit 1 ;;
        esac
        url="https://github.com/AlexxIT/go2rtc/releases/latest/download/$asset"
        echo "Fetching $asset (latest)…"
        case "$asset" in
          *.zip)
            tmp=$(mktemp -d)
            curl -fL -o "$tmp/go2rtc.zip" "$url"
            unzip -o "$tmp/go2rtc.zip" -d "$tmp" >/dev/null
            bin=$(find "$tmp" -type f ! -name '*.zip' | head -1)
            mv "$bin" bin/go2rtc
            rm -rf "$tmp"
            ;;
          *)
            curl -fL -o bin/go2rtc "$url"
            ;;
        esac
        chmod +x bin/go2rtc
        echo "✓ go2rtc → bin/go2rtc"

  go2rtc:
    desc: Run the go2rtc sidecar standalone for debugging (web UI at http://localhost:1984)
    cmds:
      - cmd: test -x bin/go2rtc || (echo "go2rtc missing — run 'task fetch-go2rtc'"; exit 1)
        silent: true
      - ./bin/go2rtc

  ai:
    desc: Run the AI vision sidecar locally (ai/sidecar) on :8000 — same contract as RunPod
    dir: ai/sidecar
    cmds:
      - |
        set -e
        # torch/numpy/ultralytics ship prebuilt wheels only for Python 3.10–3.12.
        # Newer interpreters (3.13/3.14) fall back to compiling from source, which
        # fails — so pick a supported one for the venv.
        PY=""
        for c in python3.12 python3.11 python3.10; do
          command -v "$c" >/dev/null 2>&1 && { PY="$c"; break; }
        done
        if [ -z "$PY" ]; then
          echo "Need Python 3.10–3.12 (3.13/3.14 have no prebuilt wheels for torch/numpy)."
          exit 1
        fi
        [ -d .venv ] || "$PY" -m venv .venv
        # Install CPU deps on first run only (the marker keeps later `task dev` starts fast).
        if [ ! -f .venv/.deps-installed ]; then
          ./.venv/bin/pip install -q --upgrade pip wheel
          # cython + numpy<2 FIRST: insightface builds a Cython ext, and torch needs numpy 1.x.
          ./.venv/bin/pip install -q cython 'numpy<2'
          # Local dev runs on CPU — swap onnxruntime-gpu -> onnxruntime (the Docker image keeps -gpu).
          ./.venv/bin/pip install -q $(sed 's/onnxruntime-gpu.*/onnxruntime/' requirements.txt | grep -v '^#' | grep -v '^$') torch torchvision
          # Re-pin numpy<2: torch/ultralytics/onnxruntime pull in numpy 2, which breaks torch.
          ./.venv/bin/pip install -q 'numpy<2'
          touch .venv/.deps-installed
        fi
        echo "AI sidecar → http://localhost:8000  (point the app at AI_SERVICE_URL=http://localhost:8000/runsync)"
        exec ./.venv/bin/python handler.py --rp_serve_api

  ai-stop:
    desc: Stop the local AI sidecar (the one `task dev` / `task ai` started on :8000)
    cmds:
      - pkill -f 'handler.py --rp_serve_api' && echo "AI sidecar stopped" || echo "AI sidecar was not running"

  ai-build:
    desc: Build the AI sidecar Docker image for RunPod (linux/amd64). Set AI_IMAGE=<registry>/<repo>:<tag>
    dir: ai/sidecar
    requires:
      vars: [AI_IMAGE]
    cmds:
      - cmd: command -v docker >/dev/null 2>&1 || { echo "docker not found — install Docker Desktop"; exit 1; }
        silent: true
      # RunPod runs amd64; buildx --load puts the single-arch image in the local daemon.
      - docker buildx build --platform linux/amd64 -t {{.AI_IMAGE}} --load .

  ai-push:
    desc: Push the AI sidecar image to its registry (run `docker login` first)
    requires:
      vars: [AI_IMAGE]
    cmds:
      - docker push {{.AI_IMAGE}}

  ai-deploy:
    desc: Build + push the AI sidecar image to RunPod's registry (set AI_IMAGE, `docker login`)
    requires:
      vars: [AI_IMAGE]
    cmds:
      - task: ai-build
      - task: ai-push
      - cmd: |
          echo ""
          echo "✅ Pushed {{.AI_IMAGE}}"
          echo "Now in RunPod → Serverless:"
          echo "  • First time: New Endpoint → container image {{.AI_IMAGE}}, flex workers (min 0),"
          echo "    a GPU worker (16 GB is plenty). Copy the Endpoint ID + an API key into .env:"
          echo "      AI_SERVICE_URL=https://api.runpod.ai/v2/<endpoint_id>/runsync"
          echo "      AI_SERVICE_KEY=<runpod_api_key>"
          echo "  • Updates: bump the image tag (or release a new worker) so the endpoint pulls it."
        silent: true

  doctor:
    desc: Check required system tools are installed (node, npm, cargo, ffmpeg)
    silent: true
    cmds:
      - |
        missing=0
        for t in node npm cargo ffmpeg; do
          if command -v "$t" >/dev/null 2>&1; then
            echo "✓ $t  ($(command -v "$t"))"
          else
            echo "✗ $t  — MISSING"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo ""
          echo "Install on macOS:  brew install node rust ffmpeg"
          exit 1
        fi

  db-up:
    desc: Start Postgres + pgvector (compose) and wait until it's healthy
    cmds:
      - docker compose up -d
      - cmd: |
          echo "Waiting for Postgres…"
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U sentinel -d sentinel >/dev/null 2>&1; then
              echo "✓ Postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "✗ Postgres did not become ready in time"; exit 1
        silent: true

  db-down:
    desc: Stop the Postgres container (data is kept in the named volume)
    cmds:
      - docker compose down

  db-logs:
    desc: Tail the Postgres container logs
    cmds:
      - docker compose logs -f db

  flow:
    desc: Run sentinel-flow — the always-on workflow engine service (REST + SSE on :8787)
    dir: sentinel-flow
    deps: [db-up]
    env:
      FLOW_BIND: '{{.FLOW_BIND | default "127.0.0.1:8787"}}'
    cmds:
      - cargo run

  notification:
    desc: Run sentinel-notification — consumes the notification queue + sends (on :8791)
    dir: sentinel-notification
    deps: [db-up]
    env:
      NOTIFY_BIND: '{{.NOTIFY_BIND | default "127.0.0.1:8791"}}'
    cmds:
      - cargo run

  flow-build:
    desc: Build sentinel-flow (release)
    dir: sentinel-flow
    cmds:
      - cargo build --release

  flow-check:
    desc: Type-check sentinel-flow
    dir: sentinel-flow
    cmds:
      - cargo check

  control:
    desc: Run sentinel-control — the control plane (camera config API on :8790)
    dir: sentinel-control
    deps: [db-up]
    env:
      CONTROL_BIND: '{{.CONTROL_BIND | default "127.0.0.1:8790"}}'
    cmds:
      - cargo run

  edge:
    desc: Run sentinel-edge — the on-prem camera gateway (config-light; go2rtc + snapshots on :8788)
    dir: sentinel-edge
    env:
      EDGE_BIND: '{{.EDGE_BIND | default "127.0.0.1:8788"}}'
      CONTROL_URL: '{{.CONTROL_URL | default "http://127.0.0.1:8790"}}'
      # The edge owns go2rtc; point it at the binary `task fetch-go2rtc` drops in ./bin.
      GO2RTC_BIN: '{{.GO2RTC_BIN | default "../bin/go2rtc"}}'
    cmds:
      - cargo run

  gateway:
    desc: Run sentinel-gateway — the public streaming bridge (MSE WS + snapshots on :8789)
    dir: sentinel-gateway
    env:
      GATEWAY_BIND: '{{.GATEWAY_BIND | default "127.0.0.1:8789"}}'
      EDGE_UPSTREAM: '{{.EDGE_UPSTREAM | default "http://127.0.0.1:1984"}}'
    cmds:
      - cargo run

  cloud-deploy:
    desc: "Build cloud images locally → push to GHCR → roll the VPS (manual deploy.yml; needs Docker + gh login). Subset: task cloud-deploy -- sentinel-control sentinel-flow"
    cmds:
      - ./deploy/push-local.sh {{.CLI_ARGS}}

  cloud-deploy-clean:
    desc: "Like cloud-deploy, but force-removes any orphaned service container on the VPS first — recovers a deploy left half-rolled by an interruption (the 'container name … is already in use' conflict). Subset: task cloud-deploy-clean -- sentinel-control"
    cmds:
      - CLEAN=1 ./deploy/push-local.sh {{.CLI_ARGS}}

  clean-space:
    desc: "Reclaim disk space — cargo clean (edge crate + workspace), drop the installer build dirs, prune Docker. Everything removed is a regenerable build artifact (the ffmpeg-universal build under deploy/macos-pkg/build takes ~20 min to rebuild)."
    cmds:
      # Rust target dirs are by far the biggest: the edge is a standalone crate (its own target/,
      # incl. the windows-gnu/linux cross builds), the rest is the workspace.
      - cargo clean --manifest-path sentinel-edge/Cargo.toml
      - cargo clean
      - rm -rf deploy/macos-pkg/build deploy/windows/build
      # Unused images + build cache. Images backing running containers are kept.
      - docker system prune -af
      - 'echo "✓ free space now:"; df -h / | tail -1'

  edge-build:
    desc: Build the edge binary for the current platform (release; pure Rust, no native deps)
    dir: sentinel-edge
    cmds:
      - cargo build --release

  edge-linux-build:
    desc: "Cross-build the edge binary for Linux (amd64) in a Fedora container → sentinel-edge/dist/sentinel-edge-linux-x86_64. Needs OrbStack/Docker. Set FEDORA=NN to match the appliance's Fedora major (Bazzite)."
    vars:
      FEDORA: '{{.FEDORA | default "42"}}'
    cmds:
      - mkdir -p sentinel-edge/dist
      # Build on Fedora (the appliance is Bazzite = immutable Fedora). The edge is pure Rust,
      # so this only pins the **glibc** floor — not an OpenCV soname, as it once did.
      - docker build --platform linux/amd64 -f deploy/edge-linux/Dockerfile
          --build-arg FEDORA={{.FEDORA}} --target artifact
          -o type=local,dest=sentinel-edge/dist/tmp .
      - mv sentinel-edge/dist/tmp/out/sentinel-edge sentinel-edge/dist/sentinel-edge-linux-x86_64
      - rm -rf sentinel-edge/dist/tmp
      - 'echo "✓ sentinel-edge/dist/sentinel-edge-linux-x86_64 ($(file sentinel-edge/dist/sentinel-edge-linux-x86_64 | cut -d: -f2-))"'

  edge-linux-build-arm64:
    desc: >-
      Build the edge for Linux aarch64 NATIVELY on the Jetson (NVIDIA Orin, Ubuntu 22.04) over SSH —
      fast, on real ARM64 hardware, no qemu emulation. Rsyncs the sources, `cargo build --release
      --features gst-linked` on the box, scp's the binary back to
      sentinel-edge/dist/sentinel-edge-linux-aarch64 (the name install.sh serves). Key
      id_olharai_ed25519 → jackes@128.201.138.25:52288 (override JET/JPORT/JKEY to point elsewhere).
      Self-heals a missing Rust toolchain. GStreamer -dev must be present on the box (it is).
    vars:
      JET: '{{.JET | default "jackes@128.201.138.25"}}'
      JPORT: '{{.JPORT | default "52288"}}'
      JKEY: '{{.JKEY | default "~/.ssh/id_olharai_ed25519"}}'
    cmds:
      - |
        set -e
        K="{{.JKEY}}"; K="${K/#\~/$HOME}"; JET="{{.JET}}"; P="{{.JPORT}}"
        SSH="ssh -i $K -p $P -o IdentitiesOnly=yes -o BatchMode=yes"
        echo "▸ arm64 on the Jetson ($JET) — native, no qemu…"
        $SSH "$JET" 'mkdir -p ~/sentinel-build/sentinel-edge ~/sentinel-build/crates && \
          (command -v ~/.cargo/bin/cargo >/dev/null || (curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null))'
        rsync -az --delete -e "$SSH" --exclude target/ --exclude dist/ sentinel-edge/ "$JET:sentinel-build/sentinel-edge/"
        rsync -az --delete -e "$SSH" --exclude target/ crates/ "$JET:sentinel-build/crates/"
        $SSH "$JET" 'cd ~/sentinel-build/sentinel-edge && ~/.cargo/bin/cargo build --release --features gst-linked'
        mkdir -p sentinel-edge/dist
        scp -i "$K" -P "$P" -o IdentitiesOnly=yes "$JET:sentinel-build/sentinel-edge/target/release/sentinel-edge" sentinel-edge/dist/sentinel-edge-linux-aarch64
        echo "✓ sentinel-edge/dist/sentinel-edge-linux-aarch64 (Jetson-native: $(file sentinel-edge/dist/sentinel-edge-linux-aarch64 | cut -d: -f2-))"

  edge-windows-build:
    desc: "Cross-build the edge for Windows (x86_64-pc-windows-gnu) from macOS/Linux. Needs mingw-w64 (brew install mingw-w64) + `rustup target add x86_64-pc-windows-gnu`. Pure Rust since #79, so it just works — no native deps, no MSVC SDK. Output: sentinel-edge/target/x86_64-pc-windows-gnu/release/sentinel-edge.exe"
    dir: sentinel-edge
    cmds:
      - cargo build --release --target x86_64-pc-windows-gnu
      - 'echo "✓ $(file target/x86_64-pc-windows-gnu/release/sentinel-edge.exe | cut -d: -f2-)"'

  edge-linux-build-ubuntu:
    desc: "Cross-build the edge binary for Debian/Ubuntu (amd64, glibc/apt) → sentinel-edge/dist/sentinel-edge-linux-x86_64-gnu. Set UBUNTU=22.04 for an older glibc floor."
    vars:
      UBUNTU: '{{.UBUNTU | default "24.04"}}'
    cmds:
      - mkdir -p sentinel-edge/dist
      - docker build --platform linux/amd64 -f deploy/edge-linux/Dockerfile.ubuntu
          --build-arg UBUNTU={{.UBUNTU}} --target artifact
          -o type=local,dest=sentinel-edge/dist/ubuntu .
      - mv sentinel-edge/dist/ubuntu/out/sentinel-edge sentinel-edge/dist/sentinel-edge-linux-x86_64-gnu
      - rm -rf sentinel-edge/dist/ubuntu
      - 'echo "✓ sentinel-edge/dist/sentinel-edge-linux-x86_64-gnu ($(file sentinel-edge/dist/sentinel-edge-linux-x86_64-gnu | cut -d: -f2-))"'

  edge-bump-version:
    desc: "Internal: bump sentinel-edge/Cargo.toml's patch version by 1. Every edge-publish/edge-linux-publish calls this FIRST, so a shipped binary's version always moves — never ships silently unchanged. Run standalone only if you want a bump with no build."
    cmds:
      - |
        set -e
        CUR="$(awk -F'"' '/^version = /{print $2; exit}' sentinel-edge/Cargo.toml)"
        NEXT="$(awk -F. -v OFS=. '{$3=$3+1; print}' <<< "$CUR")"
        awk -v new="$NEXT" '!done && /^version = "/{sub(/"[^"]+"/, "\"" new "\""); done=1} {print}' \
          sentinel-edge/Cargo.toml > sentinel-edge/Cargo.toml.bump && mv sentinel-edge/Cargo.toml.bump sentinel-edge/Cargo.toml
        # Cargo.lock pins sentinel-edge's own version too — keep it in lockstep so a
        # subsequent `cargo build` doesn't rewrite Cargo.lock as an unrelated-looking diff.
        awk -v new="$NEXT" '
          /^name = "sentinel-edge"$/ { print; getline; sub(/"[^"]+"/, "\"" new "\""); print; next }
          { print }
        ' sentinel-edge/Cargo.lock > sentinel-edge/Cargo.lock.bump && mv sentinel-edge/Cargo.lock.bump sentinel-edge/Cargo.lock
        echo "✓ sentinel-edge version: ${CUR} → ${NEXT}"

  edge-linux-publish:
    desc: "Bump the edge version, cross-build the Linux edge binary + scp to the VPS dist server as sentinel-edge-linux-x86_64 + redeploy control (bumps LATEST_EDGE_VERSION) + verify."
    cmds:
      - task: edge-bump-version
      - task: edge-linux-build
      - |
        set -e
        echo "Uploading sentinel-edge-linux-x86_64 → /ibbf/edge-dist/ …"
        scp -i ~/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes \
          sentinel-edge/dist/sentinel-edge-linux-x86_64 \
          root@85.239.248.86:/ibbf/edge-dist/sentinel-edge-linux-x86_64
        echo "✓ Binary uploaded — redeploying control to bump LATEST_EDGE_VERSION …"
      - task: cloud-deploy
        vars: { CLI_ARGS: sentinel-control }
      - |
        set -e
        CARGO_VER="$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
        LIVE_VER="$(ssh -i ~/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes root@85.239.248.86 \
          'docker exec sentinel-control env' | grep LATEST_EDGE_VERSION | cut -d= -f2)"
        if [ "$CARGO_VER" = "$LIVE_VER" ]; then
          echo "✓ LATEST_EDGE_VERSION=${LIVE_VER} matches Cargo.toml — UI badge is correct"
        else
          echo "✗ MISMATCH: Cargo.toml=${CARGO_VER} but container has LATEST_EDGE_VERSION=${LIVE_VER}"
          exit 1
        fi

  edge-pkg:
    desc: "Build the macOS installer (.pkg) — UNSIGNED, for testing on this Mac only. Gatekeeper blocks it elsewhere."
    cmds:
      - ./deploy/macos-pkg/build.sh

  edge-pkg-signed:
    desc: "Build + sign + notarize the macOS installer (.pkg) — the release artifact. Needs MACOS_APP_CERT, MACOS_PKG_CERT, NOTARY_PROFILE (see deploy/macos-pkg/README.md)."
    cmds:
      - ./deploy/macos-pkg/build.sh --sign

  edge-publish:
    desc: "Bump the edge version, build the edge binary + scp to the VPS dist server + redeploy control (so LATEST_EDGE_VERSION matches) + verify. Full release in one shot."
    cmds:
      - task: edge-bump-version
      - task: edge-build
      - |
        set -e
        os=$(uname -s); arch=$(uname -m)
        case "$os-$arch" in
          Darwin-x86_64)             asset=sentinel-edge-macos-x86_64 ;;
          Darwin-arm64)              asset=sentinel-edge-macos-arm64 ;;
          Linux-x86_64)              asset=sentinel-edge-linux-x86_64 ;;
          Linux-aarch64|Linux-arm64) asset=sentinel-edge-linux-arm64 ;;
          *) echo "Unsupported $os-$arch"; exit 1 ;;
        esac
        echo "Uploading sentinel-edge → /ibbf/edge-dist/$asset …"
        scp -i ~/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes \
          sentinel-edge/target/release/sentinel-edge \
          root@85.239.248.86:/ibbf/edge-dist/$asset
        echo "✓ Binary uploaded — redeploying control to bump LATEST_EDGE_VERSION …"
      - task: cloud-deploy
        vars: { CLI_ARGS: sentinel-control }
      - |
        # Verify LATEST_EDGE_VERSION in the running container matches Cargo.toml.
        # If they diverge the UI update badge will be wrong (shows stale or missing).
        set -e
        CARGO_VER="$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
        LIVE_VER="$(ssh -i ~/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes root@85.239.248.86 \
          'docker exec sentinel-control env' | grep LATEST_EDGE_VERSION | cut -d= -f2)"
        if [ "$CARGO_VER" = "$LIVE_VER" ]; then
          echo "✓ LATEST_EDGE_VERSION=${LIVE_VER} matches Cargo.toml — UI badge is correct"
        else
          echo "✗ MISMATCH: Cargo.toml=${CARGO_VER} but container has LATEST_EDGE_VERSION=${LIVE_VER}"
          echo "  Run: task cloud-deploy -- sentinel-control"
          exit 1
        fi

  edge-release:
    desc: >-
      THE edge release — ONE command. Bumps the version, builds + VERIFIES every locally-buildable
      platform (macOS GStreamer .pkg signed+notarized, Linux x86_64 + aarch64, all gst-linked),
      publishes to the site (/ibbf/edge-dist), bumps LATEST_EDGE_VERSION, and gates on the real
      install journey (gst-selftest — a bundle that can't do RTSP/live NEVER ships). Windows builds
      in CI (release.yml — it needs a Windows/MSVC runner). Never hand-run the per-platform
      build/sign/scp steps; run this. Signing certs default to the Jackes Lemos Developer ID +
      `sentinel-notary`; override MACOS_APP_CERT/MACOS_PKG_CERT/NOTARY_PROFILE in .env if they change.
    cmds:
      # One version bump for the whole fleet, so every platform's binary reports the same new version.
      - task: edge-bump-version
      # ---- macOS: the GStreamer bundle — the SOLE backend — signed + notarized (Intel x86_64) ----
      - |
        set -e
        export MACOS_APP_CERT="${MACOS_APP_CERT:-Developer ID Application: Jackes Lemos (3A4H2Y6ZVM)}"
        export MACOS_PKG_CERT="${MACOS_PKG_CERT:-Developer ID Installer: Jackes Lemos (3A4H2Y6ZVM)}"
        export NOTARY_PROFILE="${NOTARY_PROFILE:-sentinel-notary}"
        ./deploy/macos-pkg/build-gst.sh --sign
      # ---- USER-JOURNEY GATE: run the SAME gst-selftest the postinstall runs, on the freshly built
      #      bundle. rtspsrc + rtpbin/rtpjitterbuffer/udpsrc/udpsink must build, or we ABORT before
      #      publishing — this is what stops us ever shipping a broken (no-RTSP/live) bundle again. ----
      - |
        set -e
        PL="deploy/macos-pkg/build/payload-gst/opt/sentinel-edge"
        echo "▸ user-journey gate: gst-selftest on the built macOS bundle…"
        reg="$(mktemp)"
        GST_PLUGIN_SYSTEM_PATH_1_0="" GST_PLUGIN_PATH_1_0="$PWD/$PL/gst/plugins" \
          GST_REGISTRY_1_0="$reg" GST_REGISTRY_FORK=no \
          "$PL/sentinel-edge" gst-selftest
        echo "✓ macOS bundle passes gst-selftest — RTSP/live capable"
      # ---- Linux: gst-linked, both arches (install.sh pulls sentinel-edge-linux-<uname -m>) ----
      - task: edge-linux-build
      - task: edge-linux-build-arm64
      # ---- publish every artifact under the canonical names the app + install.sh serve ----
      - |
        set -e
        VER="$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
        SCP="scp -i $HOME/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes"
        DIST=root@85.239.248.86:/ibbf/edge-dist
        echo "▸ publishing edge v$VER → /ibbf/edge-dist …"
        # The GStreamer bundle IS the macOS edge now — publish it under the canonical pkg name the
        # installers endpoint serves (Sentinel-Edge-<ver>.pkg), retiring the old go2rtc/ffmpeg pkg.
        $SCP "deploy/macos-pkg/build/Sentinel-Edge-${VER}-gst-x86_64.pkg" "$DIST/Sentinel-Edge-${VER}.pkg"
        $SCP sentinel-edge/dist/sentinel-edge-linux-x86_64  "$DIST/sentinel-edge-linux-x86_64"
        $SCP sentinel-edge/dist/sentinel-edge-linux-aarch64 "$DIST/sentinel-edge-linux-aarch64"
        echo "✓ macOS .pkg + Linux x86_64/aarch64 uploaded"
      # ---- bump LATEST_EDGE_VERSION (cloud-deploy reads the edge Cargo.toml → control env) ----
      - task: cloud-deploy
        vars: { CLI_ARGS: sentinel-control }
      # ---- verify: live LATEST_EDGE_VERSION matches Cargo.toml AND the site serves the new pkg ----
      - |
        set -e
        VER="$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
        SSH="ssh -i $HOME/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes root@85.239.248.86"
        LIVE="$($SSH 'docker exec sentinel-control env' | grep '^LATEST_EDGE_VERSION=' | cut -d= -f2 | tr -d '\r')"
        [ "$VER" = "$LIVE" ] || { echo "✗ LATEST_EDGE_VERSION=$LIVE != Cargo.toml=$VER — run: task cloud-deploy -- sentinel-control"; exit 1; }
        echo "✓ LATEST_EDGE_VERSION=$LIVE matches Cargo.toml"
        $SSH "test -f /ibbf/edge-dist/Sentinel-Edge-${VER}.pkg" && echo "✓ site serves Sentinel-Edge-${VER}.pkg"
        echo ""
        echo "✓ edge v$VER released — macOS (GStreamer, signed+notarized) + Linux x86_64/aarch64, gst-selftest-gated."
        echo "  ⚠ Windows (SentinelEdge-Windows-${VER}.zip): gst-linked needs a Windows/MSVC runner → build in CI (release.yml)."

  flow-scale:
    desc: "Scale sentinel-flow to N replicas on the VPS (task flow-scale -- 2). Docker DNS round-robins across them automatically — no redeploy needed."
    cmds:
      - |
        set -e
        N="{{.CLI_ARGS}}"
        if [ -z "$N" ] || ! echo "$N" | grep -qE '^[0-9]+$'; then
          echo "Usage: task flow-scale -- <count>  (e.g. task flow-scale -- 2)"
          exit 1
        fi
        echo ">> Scaling sentinel-flow → ${N} replica(s) …"
        ssh -i ~/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes root@85.239.248.86 \
          "cd /ibbf && docker compose -f docker-compose.yml -f docker-compose.sentinel.yml up -d --scale sentinel-flow=${N} --no-recreate"
        echo ">> Verifying …"
        RUNNING=$(ssh -i ~/.ssh/id_contab_ed25519 -o IdentitiesOnly=yes root@85.239.248.86 \
          "docker ps --filter name=ibbf-sentinel-flow --format '{{.Names}}' | wc -l | tr -d ' '")
        echo "✓ sentinel-flow: ${RUNNING} replica(s) running"

  services-check:
    desc: Type-check all detachable services (shared workspace)
    cmds:
      - cargo check --workspace

  dev:
    desc: Run the SvelteKit web dev server (hot-reload) on :5173
    dir: "{{.APP}}"
    cmds:
      - npm run dev

  build:
    desc: Build the SvelteKit frontend (static)
    dir: "{{.APP}}"
    cmds:
      - npm run build

  check:
    desc: Type-check the frontend (svelte-check)
    dir: "{{.APP}}"
    cmds:
      - npm run check

  cargo:
    desc: cargo check the whole Rust workspace (services + app-core)
    cmds:
      - cargo check --workspace

  fmt:
    desc: Format the Rust workspace
    cmds:
      - cargo fmt --all

  verify:
    desc: Full verify — Rust cargo check + SvelteKit build (what CI should gate on)
    deps: [cargo, build]

  clean:
    desc: Remove build artifacts (web build/, .svelte-kit/, Rust target/)
    cmds:
      - rm -rf {{.APP}}/build {{.APP}}/.svelte-kit target
