# Task runner (https://taskfile.dev) for the NEW web app (Tauri + SvelteKit) in ./app.
# The ratatui app at the repo root is unaffected. Install Task: `brew install go-task`.
# Run `task` to list, `task dev` to launch the desktop app.
version: "3"

# Load secrets from the gitignored root .env (ANTHROPIC_API_KEY, ELEVENLABS_*,
# TELEGRAM_*). Copy .env.example → .env and fill it in. Single source of truth,
# shared with the ratatui debugger (VS Code launch.json envFile).
dotenv: [".env"]

vars:
  APP: app # the web app directory

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: One-shot — fetch & install ALL deps (npm + Rust crates + go2rtc sidecar)
    dir: "{{.APP}}"
    cmds:
      - npm install
      - cargo fetch
      - task: fetch-go2rtc
      - cmd: echo "✅ Setup complete. Run 'task doctor' to check system tools, then 'task dev'."
        silent: true

  install:
    desc: Install the web app's frontend dependencies (npm)
    dir: "{{.APP}}"
    cmds:
      - npm install

  fetch-go2rtc:
    desc: Download the go2rtc live-video sidecar into src-tauri/binaries (skips if present)
    dir: "{{.APP}}"
    status:
      - test -x src-tauri/binaries/go2rtc
    cmds:
      - |
        set -e
        mkdir -p src-tauri/binaries
        os=$(uname -s); arch=$(uname -m)
        # NOTE: macOS assets are .zip (extract the binary); Linux assets are bare.
        case "$os-$arch" in
          Darwin-arm64)               asset=go2rtc_mac_arm64.zip ;;
          Darwin-x86_64)              asset=go2rtc_mac_amd64.zip ;;
          Linux-x86_64)               asset=go2rtc_linux_amd64 ;;
          Linux-aarch64|Linux-arm64)  asset=go2rtc_linux_arm64 ;;
          *) echo "Unsupported $os-$arch — fetch go2rtc manually (see src-tauri/binaries/DOWNLOAD.md)"; exit 1 ;;
        esac
        url="https://github.com/AlexxIT/go2rtc/releases/latest/download/$asset"
        echo "Fetching $asset (latest)…"
        case "$asset" in
          *.zip)
            tmp=$(mktemp -d)
            curl -fL -o "$tmp/go2rtc.zip" "$url"
            unzip -o "$tmp/go2rtc.zip" -d "$tmp" >/dev/null
            bin=$(find "$tmp" -type f ! -name '*.zip' | head -1)
            mv "$bin" src-tauri/binaries/go2rtc
            rm -rf "$tmp"
            ;;
          *)
            curl -fL -o src-tauri/binaries/go2rtc "$url"
            ;;
        esac
        chmod +x src-tauri/binaries/go2rtc
        echo "✓ go2rtc → src-tauri/binaries/go2rtc"

  go2rtc:
    desc: Run the go2rtc sidecar standalone for debugging (web UI at http://localhost:1984)
    dir: "{{.APP}}/src-tauri"
    cmds:
      - cmd: test -x binaries/go2rtc || (echo "go2rtc missing — run 'task fetch-go2rtc'"; exit 1)
        silent: true
      # Uses the app's generated config if present (validate a camera in-app first),
      # otherwise starts empty — add streams via the web UI at :1984.
      - |
        cfg="$HOME/Library/Application Support/com.jackesdavid.sentinel/go2rtc.yaml"
        if [ -f "$cfg" ]; then ./binaries/go2rtc -config "$cfg"; else ./binaries/go2rtc; fi

  ai:
    desc: Run the AI vision sidecar locally (ai/sidecar) on :8000 — same contract as RunPod
    dir: ai/sidecar
    cmds:
      - |
        set -e
        # torch/numpy/ultralytics ship prebuilt wheels only for Python 3.10–3.12.
        # Newer interpreters (3.13/3.14) fall back to compiling from source, which
        # fails — so pick a supported one for the venv.
        PY=""
        for c in python3.12 python3.11 python3.10; do
          command -v "$c" >/dev/null 2>&1 && { PY="$c"; break; }
        done
        if [ -z "$PY" ]; then
          echo "Need Python 3.10–3.12 (3.13/3.14 have no prebuilt wheels for torch/numpy)."
          exit 1
        fi
        [ -d .venv ] || "$PY" -m venv .venv
        # Install CPU deps on first run only (the marker keeps later `task dev` starts fast).
        if [ ! -f .venv/.deps-installed ]; then
          ./.venv/bin/pip install -q --upgrade pip wheel
          # cython + numpy<2 FIRST: insightface builds a Cython ext, and torch needs numpy 1.x.
          ./.venv/bin/pip install -q cython 'numpy<2'
          # Local dev runs on CPU — swap onnxruntime-gpu -> onnxruntime (the Docker image keeps -gpu).
          ./.venv/bin/pip install -q $(sed 's/onnxruntime-gpu.*/onnxruntime/' requirements.txt | grep -v '^#' | grep -v '^$') torch torchvision
          # Re-pin numpy<2: torch/ultralytics/onnxruntime pull in numpy 2, which breaks torch.
          ./.venv/bin/pip install -q 'numpy<2'
          touch .venv/.deps-installed
        fi
        echo "AI sidecar → http://localhost:8000  (point the app at AI_SERVICE_URL=http://localhost:8000/runsync)"
        exec ./.venv/bin/python handler.py --rp_serve_api

  ai-stop:
    desc: Stop the local AI sidecar (the one `task dev` / `task ai` started on :8000)
    cmds:
      - pkill -f 'handler.py --rp_serve_api' && echo "AI sidecar stopped" || echo "AI sidecar was not running"

  ai-build:
    desc: Build the AI sidecar Docker image for RunPod (linux/amd64). Set AI_IMAGE=<registry>/<repo>:<tag>
    dir: ai/sidecar
    requires:
      vars: [AI_IMAGE]
    cmds:
      - cmd: command -v docker >/dev/null 2>&1 || { echo "docker not found — install Docker Desktop"; exit 1; }
        silent: true
      # RunPod runs amd64; buildx --load puts the single-arch image in the local daemon.
      - docker buildx build --platform linux/amd64 -t {{.AI_IMAGE}} --load .

  ai-push:
    desc: Push the AI sidecar image to its registry (run `docker login` first)
    requires:
      vars: [AI_IMAGE]
    cmds:
      - docker push {{.AI_IMAGE}}

  ai-deploy:
    desc: Build + push the AI sidecar image to RunPod's registry (set AI_IMAGE, `docker login`)
    requires:
      vars: [AI_IMAGE]
    cmds:
      - task: ai-build
      - task: ai-push
      - cmd: |
          echo ""
          echo "✅ Pushed {{.AI_IMAGE}}"
          echo "Now in RunPod → Serverless:"
          echo "  • First time: New Endpoint → container image {{.AI_IMAGE}}, flex workers (min 0),"
          echo "    a GPU worker (16 GB is plenty). Copy the Endpoint ID + an API key into .env:"
          echo "      AI_SERVICE_URL=https://api.runpod.ai/v2/<endpoint_id>/runsync"
          echo "      AI_SERVICE_KEY=<runpod_api_key>"
          echo "  • Updates: bump the image tag (or release a new worker) so the endpoint pulls it."
        silent: true

  doctor:
    desc: Check required system tools are installed (node, npm, cargo, ffmpeg)
    silent: true
    cmds:
      - |
        missing=0
        for t in node npm cargo ffmpeg; do
          if command -v "$t" >/dev/null 2>&1; then
            echo "✓ $t  ($(command -v "$t"))"
          else
            echo "✗ $t  — MISSING"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo ""
          echo "Install on macOS:  brew install node rust ffmpeg"
          exit 1
        fi

  db-up:
    desc: Start Postgres + pgvector (compose) and wait until it's healthy
    cmds:
      - docker compose up -d
      - cmd: |
          echo "Waiting for Postgres…"
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U sentinel -d sentinel >/dev/null 2>&1; then
              echo "✓ Postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "✗ Postgres did not become ready in time"; exit 1
        silent: true

  db-down:
    desc: Stop the Postgres container (data is kept in the named volume)
    cmds:
      - docker compose down

  db-logs:
    desc: Tail the Postgres container logs
    cmds:
      - docker compose logs -f db

  flow:
    desc: Run sentinel-flow — the always-on workflow engine service (REST + SSE on :8787)
    dir: sentinel-flow
    deps: [db-up]
    env:
      FLOW_BIND: '{{.FLOW_BIND | default "127.0.0.1:8787"}}'
    cmds:
      - cargo run

  flow-build:
    desc: Build sentinel-flow (release)
    dir: sentinel-flow
    cmds:
      - cargo build --release

  flow-check:
    desc: Type-check sentinel-flow
    dir: sentinel-flow
    cmds:
      - cargo check

  control:
    desc: Run sentinel-control — the control plane (camera config API on :8790)
    dir: sentinel-control
    deps: [db-up]
    env:
      CONTROL_BIND: '{{.CONTROL_BIND | default "127.0.0.1:8790"}}'
    cmds:
      - cargo run

  edge:
    desc: Run sentinel-edge — the on-prem camera gateway (config-light; go2rtc + snapshots on :8788)
    dir: sentinel-edge
    env:
      EDGE_BIND: '{{.EDGE_BIND | default "127.0.0.1:8788"}}'
      CONTROL_URL: '{{.CONTROL_URL | default "http://127.0.0.1:8790"}}'
      # The edge owns go2rtc; point it at the bundled binary the desktop app fetches.
      GO2RTC_BIN: '{{.GO2RTC_BIN | default "../app/src-tauri/binaries/go2rtc"}}'
    cmds:
      - cargo run

  gateway:
    desc: Run sentinel-gateway — the public streaming bridge (MSE WS + snapshots on :8789)
    dir: sentinel-gateway
    env:
      GATEWAY_BIND: '{{.GATEWAY_BIND | default "127.0.0.1:8789"}}'
      EDGE_UPSTREAM: '{{.EDGE_UPSTREAM | default "http://127.0.0.1:1984"}}'
    cmds:
      - cargo run

  services-check:
    desc: Type-check all detachable services (shared workspace)
    cmds:
      - cargo check --workspace

  dev:
    desc: Run the desktop app + local AI sidecar (Tauri + SvelteKit + vision service, hot-reload)
    dir: "{{.APP}}"
    deps: [db-up] # bring Postgres up first — the app requires it
    env:
      RUST_BACKTRACE: "1" # full panic traces in the terminal
    cmds:
      # Ensure the local CPU vision sidecar is up — reuse it if already running, and let it
      # OUTLIVE the app so a Tauri rebuild/restart (or a failed start) never drops it. First
      # run installs its venv via `task ai`; logs + per-op timings → /tmp/sentinel-sidecar.log.
      # Stop it with `task ai-stop`.
      - >-
        curl -s -m 1 -o /dev/null http://localhost:8000/ 2>/dev/null
        && echo "AI sidecar already up on :8000"
        || ( nohup task ai > /tmp/sentinel-sidecar.log 2>&1 & echo "AI sidecar starting in background → /tmp/sentinel-sidecar.log" )
      # Force the app at the LOCAL sidecar for dev — overrides AI_SERVICE_URL from .env so
      # development never bills RunPod. To use RunPod / the GPU box instead, change this URL.
      - AI_SERVICE_URL=http://localhost:8000/runsync npm run tauri dev

  frontend:
    desc: Run only the SvelteKit dev server (no Tauri window) on :1420
    dir: "{{.APP}}"
    cmds:
      - npm run dev

  build:
    desc: Build the SvelteKit frontend (static)
    dir: "{{.APP}}"
    cmds:
      - npm run build

  bundle:
    desc: Build the distributable Tauri desktop bundle (installers)
    dir: "{{.APP}}"
    cmds:
      - npm run tauri build

  check:
    desc: Type-check the frontend (svelte-check)
    dir: "{{.APP}}"
    cmds:
      - npm run check

  cargo:
    desc: cargo check the app workspace (Rust backend + crates/core)
    dir: "{{.APP}}"
    cmds:
      - cargo check

  fmt:
    desc: Format the Rust backend
    dir: "{{.APP}}"
    cmds:
      - cargo fmt

  verify:
    desc: Full verify — Rust cargo check + SvelteKit build (what CI should gate on)
    deps: [cargo, build]

  clean:
    desc: Remove web app build artifacts (build/, .svelte-kit/, target/)
    dir: "{{.APP}}"
    cmds:
      - rm -rf build .svelte-kit src-tauri/target target
