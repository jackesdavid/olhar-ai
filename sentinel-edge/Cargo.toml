[package]
name = "sentinel-edge"
version = "0.5.31"
edition = "2021"
description = "The edge gateway — the ONLY thing that touches cameras. Wraps go2rtc (sentinel-rtc) + ONVIF and serves on-demand JPEG snapshots over REST so out-of-process services (sentinel-flow, the UI) reach the LAN-bound cameras without speaking RTSP/ONVIF themselves. Cameras are LAN-bound, so this tier is mandatory however cloud the rest becomes."

# Standalone crate (NOT in the app/ workspace) so it ships/runs independently at the
# edge. Links the same UI-agnostic `app-core` (device repo, go2rtc helpers, ONVIF +
# snapshot capture) by path.
[dependencies]
app-core = { path = "../crates/app-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
# Pull the camera config from the control plane (cloud-managed, cached locally).
ureq = { version = "2", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
# Continuous motion detection (OpenCV MOG2) — a core edge capability, so a required dep.
# NATIVE: needs libopencv on the build + run host (Debian/Ubuntu `apt install libopencv-dev`,
# macOS `brew install opencv`). The cloud crates build per-package (`-p sentinel-flow` …) so
# they never pull OpenCV; only this edge crate does.
# 0.98+ supports OpenCV 4.13 (Fedora 44 / latest Bazzite); 0.93 crashed its binding
# generator on 4.13 ("unreachable code: Any other kind of class shouldn't be generated").
opencv = "0.98"
# RTSP ring buffer: connects to go2rtc's re-server (rtsp://127.0.0.1:8554/) for an
# in-memory pre-roll ring. We use retina only for RTSP transport + RTP ordering and
# do our OWN lenient H264 depacketization (retina's codec layer rejects go2rtc's
# repackaged NALs with "forbidden sequence 00 00 00").
retina = "0.4"
futures = "0.3"
url = "2"
