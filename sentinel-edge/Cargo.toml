[package]
name = "sentinel-edge"
version = "0.5.72"
edition = "2021"
description = "The edge gateway — the ONLY thing that touches cameras. Ingests RTSP with in-process GStreamer and serves live video, snapshots and ONVIF over REST, so out-of-process services (sentinel-flow, the UI) reach LAN-bound cameras without speaking RTSP/ONVIF themselves."

# The edge is a lib + a thin bin: the appliance runs the bin, while iOS/Android link the
# `staticlib` and drive it through the C ABI (`start_edge`/`stop_edge`) — card #144. `rlib` lets the
# bin reuse the lib.
[lib]
name = "sentinel_edge"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "sentinel-edge"
path = "src/main.rs"

# Standalone crate (NOT in the app/ workspace) so it ships/runs independently at the
# edge. Links the same UI-agnostic `app-core` (device repo, stream naming, ONVIF +
# snapshot capture) by path.
[dependencies]
# `gst-linked` here is app-core's ONVIF snapshot path. The cloud services deliberately do NOT
# enable it — they neither have nor want a GStreamer runtime — so it stays a feature there and
# the edge, which is the only GStreamer-linked binary, turns it on.
app-core = { path = "../crates/app-core", features = ["gst-linked"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
# Outbound WebSocket client — the edge dials the gateway to push live video up its own connection
# (card #144, live-over-outbound), so live works with no tailnet. rustls (pure-Rust).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.5", features = ["cors"] }
# Pull the camera config from the control plane (cloud-managed, cached locally).
ureq = { version = "2", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
# Structured logging (card #146): the capture/telemetry sites emit typed fields (`camera_ip`, `mode`,
# `fps`, …) as tracing events; the ring layer (logbuf.rs) captures them as JSON so control relays
# searchable fields to Datadog. `tracing-log` bridges the many existing `log::*` sites unchanged.
# All pure-Rust — no soname coupling, cross-compiles to musl/Windows/ARM like the rest of the edge.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
# Continuous motion detection — MOG2 (src/mog2.rs), morphology + blobs (imageproc), decode +
# resize (image). All pure Rust: the edge has NO native dependency, so it cross-compiles to
# Windows/ARM/musl with plain cargo and its binary isn't soname-coupled to the build host.
# (It used to link OpenCV for exactly this; see card #79.)
image = { version = "0.25", default-features = false, features = ["jpeg"] }
imageproc = { version = "0.25", default-features = false }
# in-memory pre-roll ring. We use retina only for RTSP transport + RTP ordering and
# repackaged NALs with "forbidden sequence 00 00 00").
retina = "0.4"
futures = "0.3"
url = "2"
# Resource-usage sampling (CPU / memory / disk) for the edge health monitor. Cross-platform
# (Linux + macOS), pure-Rust — GPU is sampled separately by shelling out to `nvidia-smi`.
sysinfo = { version = "0.30", default-features = false }

# OpenCV, ONLY for the MOG2 parity test (`cargo test --features opencv-parity`), which runs our
# pure-Rust model and OpenCV's side by side over the same frames and asserts they agree. It is not
# in the default build and never ships — this is how we prove the port didn't change what the
# cameras see, without keeping the native dependency that motivated the port.
opencv = { version = "0.98", optional = true }

# Linked gstreamer-rs — THE media path (card #138 complete). Not optional: GStreamer owns capture
# gone, so there is no second backend to fall back to and no flag to pick between them.
gstreamer = "0.23"
gstreamer-app = "0.23"

[features]
# `gst-linked` is GONE: GStreamer is the only media path, so a flag to select it selected nothing.
# It also hid a real trap — deploy/macos-pkg/build.sh built WITHOUT it, so macOS silently took the
opencv-parity = ["dep:opencv"]

