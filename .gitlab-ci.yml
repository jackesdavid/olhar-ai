# Sentinel CI — build the cloud services, push to the GitLab Container Registry, then tell the VPS
# to pull + restart. The VPS never builds.
#
# Ported from .github/workflows/{deploy,release}.yml. Two behaviours are load-bearing and were kept
# deliberately:
#
#  1. SELECTIVE builds. Only services whose files changed are rebuilt and redeployed. The Rust
#     services share crates/** (they all link app-core), so a change there rebuilds all three.
#  2. install.sh is compiled INTO control via include_str!, so a change to it must rebuild control.
#     On GitHub this was missing at first: the file lived outside sentinel-control/, changed
#     control's binary, and deployed nothing — the repo looked fixed while every box fetched the
#     old script. Keep sentinel-edge/install.sh in the control rule.
#
# Registry auth uses the built-in CI_JOB_TOKEN — no PAT anywhere, which is the point of moving off
# GHCR (that needed a classic PAT with write:packages because org packages 403'd the job token).
#
# Required CI/CD variables (Settings → CI/CD → Variables), all Masked + Protected:
#   VPS_HOST, VPS_USER   — same values as the GitHub secrets
#   VPS_SSH_KEY          — the PRIVATE id_contab_ed25519. Replaces the password auth the GitHub
#                          pipeline used (it SSHed to production as root with a password).

stages: [check, build, deploy, release]

variables:
  # registry.gitlab.com/olharai-grupo/olharai — set by GitLab, not hardcoded, so a fork or a
  # renamed project cannot push images into the original project's registry.
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  DOCKER_BUILDKIT: "1"
  # Docker-in-Docker on GitLab.com SaaS runners. Without DOCKER_HOST the client looks for a local
  # socket that does not exist in the job container and fails with "Cannot connect to the Docker
  # daemon" — which reads like the daemon crashed rather than "you never told the client where it is".
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"


# ---------------------------------------------------------------------------------------------
# Merge-request gate — cheap checks only
# ---------------------------------------------------------------------------------------------
# These are what "Pipelines must succeed" actually enforces. Deliberately NOT the Docker image
# builds: with main protected, every change arrives by MR, and five image builds per MR would
# exhaust the 400 free compute-minutes long before the month does. Compiling is what catches the
# breakage that matters; packaging it is what main is for.

check:rust:
  stage: check
  image: rust:1-bookworm
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
  script:
    # The workspace (control/flow/gateway + app-core). sqlx runs untyped queries, so this needs no
    # database — see CLAUDE.md.
    - cargo check --workspace --all-targets
    # sentinel-edge is deliberately OUT of the workspace and must be checked separately, or a
    # break in it reaches a tag unnoticed — which is exactly how Linux stopped shipping for five
    # versions behind a flag nobody compiled.
    #
    # --all-targets, like the workspace line above: without it `cargo check` never builds the test
    # targets, and the edge's `--lib` tests sat UNCOMPILABLE from migration 0083 (a `Device`
    # fixture missing four new fields) until #162 tried to add a test next to them. A suite that
    # cannot build is indistinguishable from a suite that passes.
    - cargo check --manifest-path sentinel-edge/Cargo.toml --all-targets
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:sql:
  stage: check
  image: rust:1-bookworm
  interruptible: true
  # Card #157. `check:rust` proves the 320 sqlx statements COMPILE, which for runtime queries means
  # nothing: they are strings the compiler never reads. On 2026-08-01 a removed bind shifted every
  # later placeholder one argument right, `gstreamer_ok` (boolean) got `platform` (text), and every
  # box token lookup failed — with cargo check green and all 296 tests passing.
  #
  # This job runs the statements against a real migrated schema and compares each site's `.bind()`
  # count to the statement's parameter count. See crates/app-core/tests/sql_prepare.rs.
  #
  # The service is OUR postgres image, not `postgres:17`: the migrations need pg_cron, and stock
  # Postgres cannot even install it (see deploy/postgres/Dockerfile). CI can only use it as a
  # service because CI now builds it — #156 is what makes #157 possible.
  services:
    - name: $CI_REGISTRY_IMAGE/sentinel-postgres:latest
      alias: sentinel-db
      command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=sentinel"]
  variables:
    POSTGRES_DB: sentinel
    POSTGRES_USER: sentinel
    POSTGRES_PASSWORD: sentinel
    TEST_DATABASE_URL: postgres://sentinel:sentinel@sentinel-db:5432/sentinel
  script:
    # No apt packages: app-core's gstreamer dep is optional and off by default, so unlike
    # `check:rust` this compiles nothing native.
    - cargo test -p app-core --test sql_prepare -- --nocapture
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:media:
  stage: check
  image: rust:1-bookworm
  interruptible: true
  # Card #159. `check:rust` proves the media pipeline COMPILES. Nothing proved a camera still
  # produces frames — and that gap shipped #164 to a customer box, where a watchdog that killed
  # every pipeline restart survived several releases and surfaced only when a human noticed their
  # camera was dark.
  #
  # This builds the REAL ingest pipeline against a synthetic RTSP source and asserts what a camera
  # is for: a JPEG out of the decode branch (which is also the snapshot path), fMP4 init + live
  # fragments off the SAME connection, and a finalised .mp4 clip with ftyp+moov.
  services:
    - name: bluenviron/mediamtx:latest-ffmpeg
      alias: rtsp
  variables:
    # mediamtx serves this path on demand, publishing an H264 test pattern into itself. `-g 15`
    # keeps keyframes frequent so the muxer has an IDR to start a clip on quickly.
    MTX_PATHS_TEST_RUNONDEMAND: "ffmpeg -re -f lavfi -i testsrc=size=640x480:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 15 -an -f rtsp rtsp://localhost:8554/test"
    MEDIA_SMOKE_RTSP: "rtsp://rtsp:8554/test"
  before_script:
    # Dev headers to build, and the actual runtime plugins to RUN: rtspsrc (good), h264parse (bad),
    # jpegenc/mp4mux (good), decodebin (base), software H264 decode (libav).
    - apt-get update -qq
    - apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
        gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
  script:
    - |
      set -eu
      cargo test --manifest-path sentinel-edge/Cargo.toml --lib media_smoke -- --nocapture \
        2>&1 | tee /tmp/media.log
      # The test SKIPS when MEDIA_SMOKE_RTSP is unset, and a skip exits 0. Requiring the marker is
      # what stops "no RTSP source reachable" from reading as "the media path works" — the exact
      # shape of failure this job exists to catch.
      if ! grep -q "media_smoke: RAN" /tmp/media.log; then
        echo "media_smoke did not run — the RTSP service was unreachable or the test was skipped"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &media_paths
        - sentinel-edge/src/capture.rs
        - sentinel-edge/src/recording.rs
        - sentinel-edge/src/media.rs
        - sentinel-edge/src/gst_mse.rs
        - sentinel-edge/Cargo.toml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *media_paths

check:web:
  stage: check
  image: node:22-bookworm
  interruptible: true
  # REPORTS, does not block. svelte-check finds 9 pre-existing errors on main (null-narrowing in
  # sensor-field.svelte and the workflow editor, a `Drag` union member in MapScene.svelte) that
  # predate this gate. Blocking on them would stop every merge on debt the author did not create —
  # a gate nobody can pass gets disabled, and then it protects nothing.
  # Flip to blocking the moment that count is zero.
  allow_failure: true
  script:
    - cd sentinel-app
    - npm ci --no-audit --no-fund
    # svelte-check reads .svelte-kit/tsconfig.json, which SvelteKit GENERATES. A fresh `npm ci`
    # does not create it (there is no `prepare` script), so the job failed on a missing file and
    # reported it as one svelte-check error — looking like a type error in the branch under test
    # rather than a missing build step.
    - npx svelte-kit sync
    - npx svelte-check --threshold error --output human
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [sentinel-app/**/*]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [sentinel-app/**/*]

# ---------------------------------------------------------------------------------------------
# Shared bits
# ---------------------------------------------------------------------------------------------

.registry_login: &registry_login
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.ssh_setup: &ssh_setup
  # Key-based, not password. The public half is in the VPS authorized_keys.
  #
  # VPS_SSH_KEY must be a FILE-type variable: GitLab refuses to mask multi-line values, and an
  # unmasked private key would be printable from any job. A File variable expands to a PATH, not
  # its contents — so handle both, otherwise the "obvious" read writes the literal string
  # "/builds/tmp/xyz" into id_deploy and every deploy fails with an unhelpful invalid-format error.
  - install -m 700 -d ~/.ssh
  - |
    if [ -f "$VPS_SSH_KEY" ]; then
      cp "$VPS_SSH_KEY" ~/.ssh/id_deploy          # File-type variable (expected)
    else
      printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy   # plain Variable fallback
    fi
  - chmod 600 ~/.ssh/id_deploy
  - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

.build_service:
  stage: build
  # A newer push supersedes an in-flight build rather than racing it to the VPS.
  interruptible: true
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -eu
      echo "▸ building $SERVICE from $DOCKERFILE"
      # shellcheck disable=SC2086
      docker build \
        --file "$DOCKERFILE" \
        ${BUILD_ARGS:+--build-arg $BUILD_ARGS} \
        --cache-from "$IMAGE_PREFIX/$SERVICE:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --tag "$IMAGE_PREFIX/$SERVICE:latest" \
        --tag "$IMAGE_PREFIX/$SERVICE:$CI_COMMIT_SHORT_SHA" \
        .
      docker push "$IMAGE_PREFIX/$SERVICE:latest" | tee /tmp/push.log
      docker push "$IMAGE_PREFIX/$SERVICE:$CI_COMMIT_SHORT_SHA" > /dev/null
      # The digest the registry assigned to what we just pushed (card #158). deploy asserts the
      # VPS is running exactly this — without it, "deploy succeeded" only means ssh returned 0.
      DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/push.log | tail -1)"
      if [ -z "$DIGEST" ]; then echo "could not read the pushed digest from docker push"; exit 1; fi
      # Tell the deploy job this service was actually built. A file per service rather than a
      # dotenv key: deploy must restart exactly the set that was rebuilt, and an artifact
      # directory makes that set explicit instead of reconstructed. The contents are the image
      # reference and its digest, which is what makes the deploy assertion possible.
      mkdir -p built && printf '%s %s\n' "$IMAGE_PREFIX/$SERVICE:latest" "$DIGEST" > "built/$SERVICE"
  artifacts:
    paths: [built/]
    expire_in: 1 day

# ---------------------------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------------------------

# One job, three images. Splitting them cost 53 minutes to produce three binaries that share
# app-core and nearly every dependency — each job recompiled the whole tree. Here the builder
# stage is computed ONCE and the second and third images are a file copy on top of it.
build:rust:
  stage: build
  interruptible: true
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # buildx, for a registry cache that includes INTERMEDIATE stages. Inline cache only carries
    # the final image's layers, so the expensive builder was never cached and every pipeline
    # recompiled from zero on ephemeral SaaS runners.
    #
    # The docker-container driver refuses to start when TLS comes from the environment (which is
    # how DinD is wired here) — it wants a named context instead, and says so in an error that
    # names neither DOCKER_HOST nor the variables involved. Create the context explicitly.
    - docker context create ci-dind
    - docker buildx create --use --driver docker-container ci-dind
  script:
    - |
      set -eu
      CACHE="$IMAGE_PREFIX/buildcache:rust"
      for SVC in sentinel-control sentinel-flow sentinel-gateway sentinel-notification; do
        echo "▸ $SVC"
        docker buildx build \
          --file Dockerfile \
          --build-arg PACKAGE="$SVC" \
          --cache-from "type=registry,ref=$CACHE" \
          --cache-to   "type=registry,ref=$CACHE,mode=max" \
          --tag "$IMAGE_PREFIX/$SVC:latest" \
          --tag "$IMAGE_PREFIX/$SVC:$CI_COMMIT_SHORT_SHA" \
          --metadata-file "/tmp/meta-$SVC.json" \
          --push \
          .
        # buildx reports the digest the registry assigned; deploy asserts the VPS runs it (#158).
        DIGEST="$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "/tmp/meta-$SVC.json")"
        if [ -z "$DIGEST" ]; then echo "no digest in /tmp/meta-$SVC.json"; exit 1; fi
        mkdir -p built && printf '%s %s\n' "$IMAGE_PREFIX/$SVC:latest" "$DIGEST" > "built/$SVC"
      done
  artifacts:
    paths: [built/]
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - sentinel-control/**/*
        - sentinel-flow/**/*
        - sentinel-gateway/**/*
        - sentinel-notification/**/*
        # Compiled into control via include_str! — a fix here changes control's binary.
        - sentinel-edge/install.sh
        - crates/**/*
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
        - .dockerignore
        - deploy/vps/**/*
        - .gitlab-ci.yml

# The three Rust services share crates/** and Cargo.*, so a change there rebuilds all three.
.rust_changes: &rust_changes
  - crates/**/*
  - Cargo.toml
  - Cargo.lock
  - Dockerfile




build:app:
  extends: .build_service
  variables:
    SERVICE: sentinel-app
    DOCKERFILE: deploy/app/Dockerfile
    BUILD_ARGS: VITE_COMMIT=$CI_COMMIT_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - sentinel-app/**/*
        - deploy/app/**/*
        - deploy/vps/**/*
        - .gitlab-ci.yml

build:landing:
  extends: .build_service
  variables:
    SERVICE: sentinel-landing
    DOCKERFILE: deploy/landing/Dockerfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - landing/**/*
        - deploy/landing/**/*
        - deploy/vps/**/*
        - .gitlab-ci.yml


# ---------------------------------------------------------------------------------------------
# The images that are NOT Rust services
# ---------------------------------------------------------------------------------------------
# These existed in the compose file and in NO build job. They were produced by hand with
# push-local.sh, so production ran whatever someone last happened to build.
#
# That is not a hypothetical. sentinel-notification had the same gap and drifted for weeks: it kept
# working only because its container was already RUNNING and never re-read the schema. A restart
# during the registry cutover surfaced it —
#     migration 74 was previously applied but is missing in the resolved migrations
# — and notifications were down for two hours.
#
# sentinel-postgres is the same trap and it is the DATABASE. It bundles pg_cron, so stock Postgres
# is not a substitute, and GHCR is frozen now that GitHub is archived.
#
# Rule: anything the compose file names must be rebuildable from source by CI. If CI cannot rebuild
# it, it is not deployed — it is stranded.

.build_image:
  stage: build
  interruptible: true
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create ci-dind-img
    - docker buildx create --use --driver docker-container ci-dind-img
  script:
    - |
      set -eu
      echo "▸ $IMAGE:$TAG  ($DOCKERFILE)"
      docker buildx build \
        --file "$DOCKERFILE" \
        --cache-from "type=registry,ref=$IMAGE_PREFIX/buildcache:$IMAGE-$TAG" \
        --cache-to   "type=registry,ref=$IMAGE_PREFIX/buildcache:$IMAGE-$TAG,mode=max" \
        --tag "$IMAGE_PREFIX/$IMAGE:$TAG" \
        --metadata-file /tmp/meta.json \
        --push \
        "$CONTEXT"
      DIGEST="$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' /tmp/meta.json)"
      if [ -z "$DIGEST" ]; then echo "no digest in /tmp/meta.json"; exit 1; fi
      # The marker is the compose SERVICE name, which is not necessarily the image name. deploy
      # restarts by service, so a mismatch here restarts the wrong container. Its contents are the
      # image reference (which IS the image name) and the pushed digest, for the #158 assertion.
      mkdir -p built && printf '%s %s\n' "$IMAGE_PREFIX/$IMAGE:$TAG" "$DIGEST" > "built/$SERVICE"
  artifacts:
    paths: [built/]
    expire_in: 1 day

build:postgres:
  extends: .build_image
  variables:
    IMAGE: sentinel-postgres
    TAG: latest
    SERVICE: sentinel-postgres
    DOCKERFILE: deploy/postgres/Dockerfile
    CONTEXT: deploy/postgres
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [deploy/postgres/**/*, .gitlab-ci.yml]

build:ai-cpu:
  extends: .build_image
  variables:
    IMAGE: sentinel-ai
    TAG: cpu
    SERVICE: sentinel-ai
    DOCKERFILE: ai/sidecar/Dockerfile.cpu
    CONTEXT: ai/sidecar
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [ai/sidecar/**/*, .gitlab-ci.yml]

# ---------------------------------------------------------------------------------------------
# Deploy — pull + restart ONLY what was rebuilt
# ---------------------------------------------------------------------------------------------

deploy:vps:
  stage: deploy
  image: alpine:3.20
  # Serialize: two pipelines must never race on the VPS docker compose.
  resource_group: production
  interruptible: false
  needs:
    - job: build:rust
      artifacts: true
      optional: true
    - job: build:app
      artifacts: true
      optional: true
    - job: build:landing
      artifacts: true
      optional: true
    - job: build:postgres
      artifacts: true
      optional: true
    - job: build:ai-cpu
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - |
      if [ -f "$VPS_SSH_KEY" ]; then
        cp "$VPS_SSH_KEY" ~/.ssh/id_deploy
      else
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
      fi
    # OpenSSH REQUIRES a trailing newline on a private key. A File-type CI variable is stored
    # byte-for-byte, so a paste that did not end in one produces "error in libcrypto" — which names
    # neither the key nor the newline, and reads like a corrupt or wrong-format key.
    - if [ -n "$(tail -c 1 ~/.ssh/id_deploy)" ]; then echo >> ~/.ssh/id_deploy; fi
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -eu
      # `ls built/` fails when no build job produced artifacts, and under `set -e` a variable
      # assignment whose command substitution fails exits IMMEDIATELY — so the "nothing was
      # rebuilt" guard below never ran, and the job died with exit 1 and no message at all.
      # The guard has to survive the condition it exists to report.
      SERVICES=""
      if [ -d built ]; then
        SERVICES="$(ls built/ | tr '\n' ' ' | sed 's/ *$//')"
      fi
      if [ -z "$SERVICES" ]; then
        echo "nothing was rebuilt — not touching the VPS"
        exit 0
      fi
      echo "▸ deploying: $SERVICES"
      # What the build stage actually pushed: one "<service> <image-ref> <digest>" line each. This
      # is the CLAIM; the remote script below is what tests it.
      EXPECTED="$(for s in $SERVICES; do printf '%s %s\n' "$s" "$(cat "built/$s")"; done)"
      echo "$EXPECTED"
      # Card #158. `pull` + `up -d` + exit 0 says nothing about what is running: for the whole
      # GitLab migration this job "succeeded" while production stayed frozen on the previous
      # images, because the compose file still pointed at the old registry. Nine merges were
      # built, stored and not running, and the pipeline was green throughout. So the deploy now
      # ends by comparing each running container's repo digest to the digest just pushed, and
      # FAILS on a mismatch. A deploy that cannot tell you what it deployed is a notification.
      ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
        "SERVICES='$SERVICES' EXPECTED='$EXPECTED' sh -s" <<'REMOTE'
      set -eu
      cd /ibbf
      COMPOSE="docker compose -f docker-compose.yml -f docker-compose.sentinel.yml"
      # shellcheck disable=SC2086
      $COMPOSE pull $SERVICES
      # shellcheck disable=SC2086
      $COMPOSE up -d $SERVICES

      # State goes through files, not shell variables: `while read` runs in a subshell, so a
      # failure counter incremented inside the loop would be discarded at the loop's end — and the
      # assertion would pass by losing its own findings.
      printf '%s\n' "$EXPECTED" > /tmp/deploy-expected.txt
      : > /tmp/deploy-failed.txt
      while read -r svc image want; do
        [ -n "$svc" ] || continue
        cid="$($COMPOSE ps -q "$svc" 2>/dev/null || true)"
        if [ -z "$cid" ]; then
          echo "$svc: expected $image@$want, but no container is running" >> /tmp/deploy-failed.txt
          continue
        fi
        # The container reports its image ID; the repo digest lives on the image. That digest is
        # what the registry assigned on push, so it is comparable to what the build job recorded.
        imgid="$(docker inspect -f '{{.Image}}' "$cid")"
        got="$(docker image inspect -f '{{join .RepoDigests " "}}' "$imgid" 2>/dev/null || true)"
        case " $got " in
          *"@$want"*) echo "✓ $svc is running $want" ;;
          *) echo "$svc: expected $image@$want, running ${got:-<no repo digest>}" >> /tmp/deploy-failed.txt ;;
        esac
      done < /tmp/deploy-expected.txt

      if [ -s /tmp/deploy-failed.txt ]; then
        echo "✗ the deploy did not take:"
        cat /tmp/deploy-failed.txt
        exit 1
      fi
      echo "✓ every rebuilt service is running the image this pipeline pushed"
      docker image prune -f
      REMOTE
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------------------------
# Release — tag v* builds the edge binaries and publishes them
# ---------------------------------------------------------------------------------------------

.edge_build:
  stage: release
  image: rust:1-bookworm
  before_script:
    # GStreamer is the ONLY media path (card #138) — the binary links it, so the dev packages are
    # required. There is no --features flag: `gst-linked` was deleted in 277f079, and release.yml
    # kept passing it, which failed every tagged Linux build silently for five versions.
    - apt-get update -qq
    - apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
  script:
    - rustup target add "$TARGET"
    - cargo build --release --locked --manifest-path sentinel-edge/Cargo.toml --target "$TARGET"
    - mkdir -p dist
    - cp "sentinel-edge/target/$TARGET/release/sentinel-edge" "dist/$ASSET"
  artifacts:
    paths: [dist/]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

release:edge-x86_64:
  extends: .edge_build
  variables:
    TARGET: x86_64-unknown-linux-gnu
    ASSET: sentinel-edge-linux-x86_64

release:edge-aarch64:
  extends: .edge_build
  variables:
    TARGET: aarch64-unknown-linux-gnu
    ASSET: sentinel-edge-linux-aarch64
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    PKG_CONFIG_ALLOW_CROSS: "1"
    PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
  before_script:
    - dpkg --add-architecture arm64
    - apt-get update -qq
    - apt-get install -y -qq gcc-aarch64-linux-gnu pkg-config
    # The GStreamer dev headers must be the ARM64 ones — the host x86 packages would satisfy
    # pkg-config and then fail at link time against a foreign-architecture object.
    - apt-get install -y -qq libgstreamer1.0-dev:arm64 libgstreamer-plugins-base1.0-dev:arm64

release:publish:
  stage: release
  image: alpine:3.20
  needs: [release:edge-x86_64, release:edge-aarch64]
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - |
      if [ -f "$VPS_SSH_KEY" ]; then
        cp "$VPS_SSH_KEY" ~/.ssh/id_deploy
      else
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
      fi
    # OpenSSH REQUIRES a trailing newline on a private key. A File-type CI variable is stored
    # byte-for-byte, so a paste that did not end in one produces "error in libcrypto" — which names
    # neither the key nor the newline, and reads like a corrupt or wrong-format key.
    - if [ -n "$(tail -c 1 ~/.ssh/id_deploy)" ]; then echo >> ~/.ssh/id_deploy; fi
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -eu
      VER="${CI_COMMIT_TAG#v}"
      cp sentinel-edge/install.sh dist/install.sh
      cp deploy/edge-dist/merge-manifest.sh dist/merge-manifest.sh
      # Versioned filenames. The unversioned name is what made a failed Linux release INVISIBLE:
      # the box re-downloaded whatever was already sitting there and reported success.
      for a in sentinel-edge-linux-x86_64 sentinel-edge-linux-aarch64; do
        [ -f "dist/$a" ] || continue
        cp "dist/$a" "dist/$a-$VER"
        sha256sum "dist/$a-$VER" | cut -d' ' -f1 > "dist/$a-$VER.sha256"
      done
      scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes dist/* "$VPS_USER@$VPS_HOST:/ibbf/edge-dist/"
      # Record ONLY what actually landed. The manifest is the published truth: control reads it to
      # answer /edge-latest, so a version that never built must never appear in it.
      SHA_X86="$(cat dist/sentinel-edge-linux-x86_64-$VER.sha256 2>/dev/null || true)"
      SHA_ARM="$(cat dist/sentinel-edge-linux-aarch64-$VER.sha256 2>/dev/null || true)"
      ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
        "cd /ibbf/edge-dist && chmod +x merge-manifest.sh && \
         { [ -n '$SHA_X86' ] && ./merge-manifest.sh linux-x86_64  '$VER' 'sentinel-edge-linux-x86_64-$VER'  '$SHA_X86'; } ; \
         { [ -n '$SHA_ARM' ] && ./merge-manifest.sh linux-aarch64 '$VER' 'sentinel-edge-linux-aarch64-$VER' '$SHA_ARM'; } ; \
         cat manifest.json"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------------------------
# Guard — the edge lockfile must match its Cargo.toml
# ---------------------------------------------------------------------------------------------

verify:edge-lock:
  stage: check
  image: rust:1-bookworm
  interruptible: true
  script:
    # release builds --locked, so a stale lock fails the release rather than this cheap job.
    - cargo metadata --locked --format-version 1 --manifest-path sentinel-edge/Cargo.toml > /dev/null
    - echo "✓ sentinel-edge Cargo.lock is in sync"
  rules:
    - changes:
        - sentinel-edge/Cargo.toml
        - sentinel-edge/Cargo.lock
