# Root workspace for the cloud services + the shared `app-core` lib. One target/ dir so
# the heavy `app-core` (tract/ONNX, image, sqlx) builds once instead of once per crate.
# The Tauri desktop shell was removed (the product is web-only now); `app-core` moved here
# from the old `app/` workspace and the SvelteKit UI lives in `sentinel-app/` (no Rust).
[workspace]
members = [
    "crates/app-core",
    "sentinel-flow",
    "sentinel-edge",
    "sentinel-gateway",
    "sentinel-control",
]
resolver = "2"
