# Root workspace for the cloud services + the shared `app-core` lib. One target/ dir so
# the heavy `app-core` (tract/ONNX, image, sqlx) builds once instead of once per crate.
# The Tauri desktop shell was removed (the product is web-only now); `app-core` moved here
# from the old `app/` workspace and the SvelteKit UI lives in `sentinel-app/` (no Rust).
[workspace]
members = [
    "crates/app-core",
    "sentinel-flow",
    "sentinel-gateway",
    "sentinel-control",
    "sentinel-notification",
]
# sentinel-edge is built + shipped independently and links a NATIVE dep (OpenCV, for the
# motion watcher). Keeping it OUT of the workspace stops its native deps from entering the
# cloud image build (cargo-chef cooks the whole workspace) — the cloud crates stay pure-Rust.
# Build the edge from its own dir: `cd sentinel-edge && cargo build --release` (needs libopencv).
exclude = ["sentinel-edge"]
resolver = "2"
