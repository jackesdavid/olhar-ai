# Postgres + pgvector for the Sentinel web app.
# Start it before the app:  task db-up   (stop: task db-down)
# Connection string lives in .env as DATABASE_URL (see .env.example).
services:
  db:
    # Postgres 17 + pgvector + pg_cron (see deploy/postgres/Dockerfile).
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    image: sentinel-postgres:local
    container_name: sentinel-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=sentinel
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Shared event fabric (pub/sub) — local dev mirror of the VPS sentinel-redis.
  # REDIS_URL=redis://127.0.0.1:6379 for flow + control.
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  # Object store for notification media (dev mirror of the VPS sentinel-minio).
  # For local flow + notification: S3_ENDPOINT=http://127.0.0.1:9000 S3_KEY=minioadmin
  # S3_SECRET=minioadmin S3_BUCKET=sentinel-media. Console at http://localhost:9001.
  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sentinel-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set m http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing m/sentinel-media; echo bucket-ready"
    restart: "no"

volumes:
  sentinel-pgdata:
  sentinel-minio:
