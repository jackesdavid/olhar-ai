[package]
name = "sentinel-flow"
version = "0.1.0"
edition = "2021"
description = "Always-on workflow engine service. Runs the Sentinel workflow DAGs, triggers, and persisted engine state out-of-process and exposes REST + SSE, so the UI/control-plane (Tauri app) can be stopped and restarted freely while automations keep firing 24/7."

# Standalone crate (NOT a member of the app/ workspace) so it can live at the repo
# root and ship/run independently. It links the same UI-agnostic `app-core` the
# Tauri shell uses — engine, nodes, repos, ports — by path.
[dependencies]
app-core = { path = "../crates/app-core" }

# Async HTTP for the REST + SSE control plane. The engine + poller + run executor
# stay synchronous on dedicated std threads (mirroring the Tauri shell); axum only
# serves the control plane. `app-core`'s Db owns its own runtime and bridges via a
# channel (never block_on the current thread), so the two coexist safely.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# `serde` is required: this pod is multi-tenant and serializes/deserializes tenant Uuids
# in the REST/SSE layer (the run API + event payloads). It must be enabled here because the
# release image builds `-p sentinel-flow` in isolation (no workspace feature unification).
uuid = { version = "1", features = ["serde"] }
chrono = "0.4"  # UTC "now" for the calendar-schedule consumer's next-occurrence math (#111)
log = "0.4"
env_logger = "0.11"
# Structured logging (card #146): flow is multi-tenant in one pod, so a per-run `tracing` span
# stamps `tenant`/`graph` centrally — every log emitted during a run inherits them (no log site
# passes tenant_id). `init_tracing` (app-core) ships them to Datadog with `service:flow`.
tracing = "0.1"
# Event fabric is Postgres NOTIFY now (card #147) — flow pods pg_notify('workflow_events', …), the
# control SSE relay LISTENs. Inbound triggers already ride the durable Postgres event_queue. No Redis.
