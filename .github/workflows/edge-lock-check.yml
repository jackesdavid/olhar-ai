name: Edge lockfile check

# Fail fast if sentinel-edge/Cargo.lock is out of sync with sentinel-edge/Cargo.toml — the exact
# trap that broke the v0.5.51 release: the edge version was bumped but the lock wasn't updated, and
# release.yml builds with `--locked`, so every platform build errored ("cannot update the lock file
# … because --locked was passed"). This runs on EVERY push/PR that touches the edge manifest or lock,
# so a stale lock is caught at merge time — long before a `v*` release tag ever builds.
on:
  push:
    paths:
      - "sentinel-edge/Cargo.toml"
      - "sentinel-edge/Cargo.lock"
      - ".github/workflows/edge-lock-check.yml"
  pull_request:
    paths:
      - "sentinel-edge/Cargo.toml"
      - "sentinel-edge/Cargo.lock"
  workflow_dispatch:

jobs:
  verify-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cargo metadata --locked` resolves the manifest against Cargo.lock WITHOUT compiling, and
      # errors exactly like release.yml's `--locked` build when they disagree (e.g. a version bump
      # that wasn't mirrored into the lock). Cheap, fast, and the same failure mode we're guarding.
      - name: Verify sentinel-edge/Cargo.lock is in sync
        working-directory: sentinel-edge
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error file=sentinel-edge/Cargo.lock::sentinel-edge/Cargo.lock is stale — run 'cd sentinel-edge && cargo update -p sentinel-edge' (or 'cargo generate-lockfile') and commit it. release.yml builds with --locked and will fail otherwise."
            exit 1
          fi
          echo "✓ sentinel-edge/Cargo.lock is in sync with Cargo.toml"
