name: release

# Build the sentinel-edge appliance binary for the platforms install.sh fetches and
# publish them (plus install.sh) to a GitHub Release. Triggered by a version tag
# (`git tag v0.1.0 && git push --tags`) or manually.
#
# Linux targets are static musl builds (no glibc coupling → run on any client box);
# app-core is pure-Rust + rustls so there's no OpenSSL to cross-compile.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    # The edge now LINKS GStreamer (card #138 — the sole media backend; go2rtc + ffmpeg retired) and
    # is outbound-only (card #144 — SSE commands + live over the outbound connection; no tailnet). So
    # every target is a NATIVE build with GStreamer dev present — no more static-musl `cross` build
    # (GStreamer is glib + dynamic plugins and cannot statically link into musl). Linux is glibc; the
    # matching GStreamer runtime is installed on the box by install.sh / install.ps1.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 → org self-hosted runner (label: self-hosted / Linux / X64);
          # arm64 on a GitHub-hosted native arm runner. macOS + Windows are built out-of-band.
          - target: x86_64-unknown-linux-gnu
            os: self-hosted
            setup: linux
            asset: sentinel-edge-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm      # native arm64 runner — no cross-compile of GStreamer
            setup: linux
            asset: sentinel-edge-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: sentinel-edge

      # ---- GStreamer dev libs, per platform (the edge links them; the box gets the runtime) ----
      - name: GStreamer dev (Linux)
        if: matrix.setup == 'linux'
        run: |
          sudo apt-get update
          # libunwind-dev is required by libgstreamer1.0-dev on ubuntu-22.04-arm
          sudo apt-get install -y --no-install-recommends pkg-config libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      # sentinel-edge is a STANDALONE crate (not in the root workspace), so build via its own manifest.
      # No --features gst-linked: the flag was DELETED in 277f079 when GStreamer became the only
      # media path. Passing a feature a crate does not declare is a hard cargo error, and because
      # release.yml only runs on a tag, it stayed invisible until the next one — Linux silently
      # stopped shipping at 0.5.65 while macOS advanced out-of-band to 0.5.70.
      - name: Build
        run: cargo build --release --locked --manifest-path sentinel-edge/Cargo.toml --target ${{ matrix.target }}

      - name: Stage asset
        run: |
          mkdir -p dist
          cp "sentinel-edge/target/${{ matrix.target }}/release/sentinel-edge" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: publish release
    needs: [build]
    # macOS and Windows are NOT built here: GitHub retired the Intel macOS runners (`macos-13`
    # queues forever, which silently blocked every release since 2026-07-27) and the Windows
    # gst build can't resolve GStreamer through pkg-config. Both are produced out-of-band and
    # uploaded to /ibbf/edge-dist directly; this workflow ships the Linux binaries the
    # appliances actually pull, so one broken platform can no longer hold the others hostage.
    if: ${{ needs.build.result == 'success' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Ship the installer alongside the binaries so the client can:
      #   curl -fsSL .../releases/latest/download/install.sh | sudo sh -s -- ...
      - name: Add installers
        run: |
          cp sentinel-edge/install.sh dist/install.sh

      # (B) Versioned copies alongside the unversioned names.
      #
      # The unversioned `sentinel-edge-linux-<arch>` is what makes a Linux update fail SILENTLY: the
      # box is told 0.5.66 exists, downloads a filename with no version in it, and gets whatever
      # happens to be on the server. Versioned names make every platform fail the same honest way
      # macOS already does. The unversioned copies stay so already-installed boxes running the old
      # install.sh keep working — they are the compatibility shim, not the contract.
      - name: Versioned copies + checksums
        id: art
        run: |
          set -euo pipefail
          VER="$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          for arch in x86_64 aarch64; do
            f="dist/sentinel-edge-linux-$arch"
            [ -f "$f" ] || continue
            cp "$f" "$f-$VER"
            echo "sha_$arch=$(shasum -a 256 "$f-$VER" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done
          cp deploy/edge-dist/merge-manifest.sh dist/merge-manifest.sh
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      # The repo is private, so tenants can't download release assets directly. Ship the
      # edge binaries + installer to the VPS; control serves them at /edge/<asset>.
      - name: Ship edge binaries to the VPS (control serves /edge)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          source: "dist/*"
          target: "/ibbf/edge-dist"
          strip_components: 1

      # (A) The manifest is the source of truth for "what is published", replacing the version that
      # deploy.yml used to sed in from Cargo.toml. Written LAST and merged per platform, so a Linux
      # release never erases the out-of-band macOS entry.
      - name: Record published artifacts in the manifest
        uses: appleboy/ssh-action@v1
        env:
          VER: ${{ steps.art.outputs.version }}
          SHA_X86: ${{ steps.art.outputs.sha_x86_64 }}
          SHA_ARM: ${{ steps.art.outputs.sha_aarch64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          envs: VER,SHA_X86,SHA_ARM
          script: |
            set -e
            cd /ibbf/edge-dist
            chmod +x merge-manifest.sh
            [ -n "$SHA_X86" ] && ./merge-manifest.sh linux-x86_64  "$VER" "sentinel-edge-linux-x86_64-$VER"  "$SHA_X86"
            [ -n "$SHA_ARM" ] && ./merge-manifest.sh linux-aarch64 "$VER" "sentinel-edge-linux-aarch64-$VER" "$SHA_ARM"
            echo '--- manifest now ---'
            cat manifest.json
