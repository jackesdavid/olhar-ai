name: deploy

# Build the cloud services and push to GHCR, then tell the VPS to pull + restart — so the VPS
# never builds. Mirrors the ibbf-service pattern.
#
# SELECTIVE: only the services whose files actually changed are built + redeployed. The Rust
# services (control/flow/gateway) share `crates/**` + `Cargo.*` (they all link app-core), so a
# change there rebuilds all three; a `sentinel-app/**`-only change rebuilds just the app. The
# `changes` job computes the build matrix + the deploy service list from the push diff.
#
# GHCR push uses the built-in GITHUB_TOKEN. The deploy step needs repo secrets: VPS_HOST,
# VPS_USER, VPS_PASS.
on:
  push:
    branches: [main]
    paths:
      - "sentinel-control/**"
      - "sentinel-gateway/**"
      - "sentinel-flow/**"
      - "sentinel-app/**"
      - "crates/**"
      - "Cargo.*"
      - "Dockerfile"
      - "deploy/app/**"
      - "deploy/landing/**"
      - "deploy/vps/**"
      - "landing/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Serialize deploys per branch: a newer push cancels an in-flight build/deploy so two
# runs never race on the VPS docker compose (and a superseded build isn't wasted).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Which services does this push actually touch? Emits the build matrix (only affected services)
  # and the space-separated service list the deploy step pulls/restarts. A manual dispatch or an
  # infra change (this workflow / the VPS compose) forces ALL services.
  changes:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            control:
              - 'sentinel-control/**'
              - 'crates/**'
              - 'Cargo.*'
              - 'Dockerfile'
            flow:
              - 'sentinel-flow/**'
              - 'crates/**'
              - 'Cargo.*'
              - 'Dockerfile'
            gateway:
              - 'sentinel-gateway/**'
              - 'crates/**'
              - 'Cargo.*'
              - 'Dockerfile'
            app:
              - 'sentinel-app/**'
              - 'deploy/app/**'
            landing:
              - 'landing/**'
              - 'deploy/landing/**'
            infra:
              - '.github/workflows/deploy.yml'
              - 'deploy/vps/**'
      - name: Assemble build matrix + service list
        id: set
        env:
          # Manual run, or an infra change → rebuild everything.
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
          C: ${{ steps.filter.outputs.control }}
          F: ${{ steps.filter.outputs.flow }}
          G: ${{ steps.filter.outputs.gateway }}
          A: ${{ steps.filter.outputs.app }}
          L: ${{ steps.filter.outputs.landing }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          items=(); svcs=()
          want() { [ "$FORCE_ALL" = "true" ] || [ "${1:-}" = "true" ]; }
          add() { # name  dockerfile  build-args
            items+=("{\"service\":\"$1\",\"file\":\"$2\",\"build-args\":\"$3\"}")
            svcs+=("$1")
          }
          if want "$C"; then add sentinel-control Dockerfile "PACKAGE=sentinel-control"; fi
          if want "$F"; then add sentinel-flow Dockerfile "PACKAGE=sentinel-flow"; fi
          if want "$G"; then add sentinel-gateway Dockerfile "PACKAGE=sentinel-gateway"; fi
          if want "$A"; then add sentinel-app deploy/app/Dockerfile "VITE_COMMIT=${SHA}"; fi
          if want "$L"; then add sentinel-landing deploy/landing/Dockerfile ""; fi
          joined="$(IFS=,; echo "${items[*]:-}")"
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          echo "services=${svcs[*]:-}" >> "$GITHUB_OUTPUT"
          echo "▸ Building: ${svcs[*]:-(none — nothing to deploy)}"

  build:
    needs: changes
    if: needs.changes.outputs.services != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ghcr.io/olharai/${{ matrix.service }}:latest
          # GHCR rejects attestation/SBOM blob HEADs with 403 for this org token; keep the image push only.
          provenance: false
          sbom: false
          # Cache Docker layers (incl. the Rust compile) in the GHA cache so a subsequent build only
          # recompiles what changed — cuts the ~12–16m cold builds to a few minutes. Per-service scope.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.services != ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # The VPS copy of the compose file has real secrets substituted into its
      # placeholders, so we never overwrite it. But LATEST_EDGE_VERSION (drives the
      # "update available" badge) must track the edge crate, so we read it from
      # sentinel-edge/Cargo.toml and sed it on the VPS in place — preserving the
      # filled-in placeholders while keeping the version honest on every deploy.
      - name: Read edge version
        id: edgever
        run: |
          VER=$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Pull + restart on the VPS (only the changed services)
        uses: appleboy/ssh-action@v1
        env:
          EDGE_VERSION: ${{ steps.edgever.outputs.version }}
          SERVICES: ${{ needs.changes.outputs.services }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          envs: EDGE_VERSION,SERVICES
          script: |
            cd /ibbf
            sed -i -E "s/(LATEST_EDGE_VERSION: ).*/\1\"${EDGE_VERSION}\"/" docker-compose.sentinel.yml
            docker compose -f docker-compose.yml -f docker-compose.sentinel.yml pull $SERVICES
            docker compose -f docker-compose.yml -f docker-compose.sentinel.yml up -d $SERVICES
            docker image prune -f
