name: deploy

# Build the cloud streaming services and push to GHCR, then tell the VPS to pull +
# restart — so the VPS never builds. Mirrors the ibbf-service pattern.
#
# GHCR push uses the built-in GITHUB_TOKEN (no PAT needed — packages live under the
# repo owner). The deploy step needs repo secrets: VPS_HOST, VPS_USER, VPS_PASS.
on:
  push:
    branches: [main]
    paths:
      - "sentinel-control/**"
      - "sentinel-gateway/**"
      - "sentinel-flow/**"
      - "sentinel-edge/**"
      - "sentinel-app/**"
      - "crates/**"
      - "Cargo.*"
      - "Dockerfile"
      - "deploy/app/**"
      - "deploy/landing/**"
      - "deploy/vps/**"
      - "landing/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Serialize deploys per branch: a newer push cancels an in-flight build/deploy so two
# runs never race on the VPS docker compose (and a superseded build isn't wasted).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: sentinel-control
            file: Dockerfile
            build-args: PACKAGE=sentinel-control
          - service: sentinel-gateway
            file: Dockerfile
            build-args: PACKAGE=sentinel-gateway
          - service: sentinel-flow
            file: Dockerfile
            build-args: PACKAGE=sentinel-flow
          - service: sentinel-app
            file: deploy/app/Dockerfile
            build-args: VITE_COMMIT=${{ github.sha }}
          - service: sentinel-landing
            file: deploy/landing/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ghcr.io/jackesdavid/${{ matrix.service }}:latest
          # Cache Docker layers (incl. the Rust compile) in the GHA cache so a subsequent build only
          # recompiles what changed — cuts the ~12–16m cold builds to a few minutes. Per-service scope.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The VPS copy of the compose file has real secrets substituted into its
      # placeholders, so we never overwrite it. But LATEST_EDGE_VERSION (drives the
      # "update available" badge) must track the edge crate, so we read it from
      # sentinel-edge/Cargo.toml and sed it on the VPS in place — preserving the
      # filled-in placeholders while keeping the version honest on every deploy.
      - name: Read edge version
        id: edgever
        run: |
          VER=$(grep -m1 '^version' sentinel-edge/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Pull + restart on the VPS
        uses: appleboy/ssh-action@v1
        env:
          EDGE_VERSION: ${{ steps.edgever.outputs.version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          envs: EDGE_VERSION
          script: |
            cd /ibbf
            sed -i -E "s/(LATEST_EDGE_VERSION: ).*/\1\"${EDGE_VERSION}\"/" docker-compose.sentinel.yml
            docker compose -f docker-compose.yml -f docker-compose.sentinel.yml pull sentinel-control sentinel-gateway sentinel-flow sentinel-app sentinel-landing
            docker compose -f docker-compose.yml -f docker-compose.sentinel.yml up -d sentinel-control sentinel-gateway sentinel-flow sentinel-app sentinel-landing
            docker image prune -f
