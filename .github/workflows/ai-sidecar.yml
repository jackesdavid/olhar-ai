name: AI sidecar image

# Builds the GPU vision sidecar (ai/sidecar) on a native linux/amd64 runner and
# pushes it to GHCR — no QEMU, so the heavy CUDA image builds reliably. The image
# runs the same on RunPod Serverless and on a local NVIDIA box (see
# ai/sidecar/compose.gpu.yml).

on:
  push:
    paths:
      - "ai/sidecar/**"
      - ".github/workflows/ai-sidecar.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag under ghcr.io/jackesdavid/sentinel-ai"
        required: false
        default: "gpu"

concurrency:
  group: ai-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CUDA base + torch + onnxruntime-gpu image is large; reclaim runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ai/sidecar
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jackesdavid/sentinel-ai:${{ github.event.inputs.tag || 'gpu' }}
          provenance: false
