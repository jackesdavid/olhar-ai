name: AI sidecar image

# Builds the vision sidecar (ai/sidecar) on a native linux/amd64 runner, pushes it to GHCR, and
# (for the CPU variant that runs on the VPS) pulls + restarts the running sentinel-ai container.
# deploy.yml doesn't cover sentinel-ai, so this workflow OWNS the sidecar's full build→deploy.
#
# Two variants:
#   • gpu (Dockerfile)     — CUDA + torch + onnxruntime-gpu; RunPod Serverless / NVIDIA box.
#   • cpu (Dockerfile.cpu) — face-only, CPU onnxruntime, no torch; runs on the VPS next to
#     sentinel-control (deploy/vps/docker-compose.sentinel.yml).
#   • dlib (Dockerfile.dlib) — A/B variant, profile-gated, never started by a normal deploy.

on:
  push:
    branches: [main]  # not on v* tags — a tag push must not rebuild the sidecar (avoids the dup)
    paths:
      - "ai/sidecar/**"
      - ".github/workflows/ai-sidecar.yml"
  workflow_dispatch:

concurrency:
  group: ai-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CPU variant runs on the VPS in the face-recognition hot path — build it on its own so a
  # flaky/slow gpu or dlib build can never block the deploy below.
  build-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (cpu)
        uses: docker/build-push-action@v6
        with:
          context: ai/sidecar
          file: ai/sidecar/Dockerfile.cpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jackesdavid/sentinel-ai:cpu
          provenance: false

  # GPU (RunPod / NVIDIA) + the dlib A/B variant — heavier, off the VPS hot path.
  build-heavy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: gpu
            file: Dockerfile
          - tag: dlib
            file: Dockerfile.dlib
    steps:
      - uses: actions/checkout@v4
      # The CUDA base + torch + onnxruntime-gpu image is large; reclaim runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ai/sidecar
          file: ai/sidecar/${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jackesdavid/sentinel-ai:${{ matrix.tag }}
          provenance: false

  # Pull the freshly-built :cpu image on the VPS and restart the running sentinel-ai container.
  deploy:
    needs: build-cpu
    runs-on: ubuntu-latest
    steps:
      - name: Pull + restart sentinel-ai on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          script: |
            cd /ibbf
            docker compose -f docker-compose.yml -f docker-compose.sentinel.yml pull sentinel-ai
            docker compose -f docker-compose.yml -f docker-compose.sentinel.yml up -d sentinel-ai
            docker image prune -f
