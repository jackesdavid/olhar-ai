name: AI sidecar image

# Builds the vision sidecar (ai/sidecar) on a native linux/amd64 runner and pushes it
# to GHCR — no QEMU, so the heavy image builds reliably. Two variants:
#   • gpu (Dockerfile)     — CUDA + torch + onnxruntime-gpu; RunPod Serverless / NVIDIA box.
#   • cpu (Dockerfile.cpu) — face-only, CPU onnxruntime, no torch; runs on the VPS next
#     to sentinel-control (deploy/vps/docker-compose.sentinel.yml).

on:
  push:
    paths:
      - "ai/sidecar/**"
      - ".github/workflows/ai-sidecar.yml"
  workflow_dispatch:

concurrency:
  group: ai-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: gpu
            file: Dockerfile
          - tag: cpu
            file: Dockerfile.cpu
          - tag: dlib
            file: Dockerfile.dlib
    steps:
      - uses: actions/checkout@v4

      # The CUDA base + torch + onnxruntime-gpu image is large; reclaim runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ai/sidecar
          file: ai/sidecar/${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jackesdavid/sentinel-ai:${{ matrix.tag }}
          provenance: false
