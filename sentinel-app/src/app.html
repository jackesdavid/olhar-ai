<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicons + app icons + PWA (derived from the dot-field mark — see docs/ref/brand.md) -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />

    <title>Sentinel</title>
    <meta name="description" content="Camera monitoring & automation — a calm assistant for home & business." />

    <!-- Open Graph / Twitter (product-level; tenant-agnostic) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sentinel" />
    <meta property="og:title" content="Sentinel" />
    <meta property="og:description" content="Camera monitoring & automation — a calm assistant for home & business." />
    <meta property="og:url" content="https://app.thesentinels.online" />
    <meta property="og:image" content="https://app.thesentinels.online/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sentinel" />
    <meta name="twitter:description" content="Camera monitoring & automation — a calm assistant for home & business." />
    <meta name="twitter:image" content="https://app.thesentinels.online/og.png" />
    <!-- Set the theme before paint to avoid a flash. Default: light ("Clean White"). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sentinel-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
