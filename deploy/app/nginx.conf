# SPA: serve static assets, fall back to index.html for client-side routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security plan §1.8: media URLs carry a token in the query string, so no outbound request
    # should ever quote one back in a `Referer`. Cheap and total — the app has no need to leak
    # where a click came from.
    #
    # nginx quirk worth knowing before editing below: `add_header` is inherited by a `location`
    # ONLY if that location declares no `add_header` of its own. `/_app/` and `/version.json` each
    # set Cache-Control, so they do NOT inherit this. That is fine — a referrer policy only means
    # anything on a document response, and documents are served by `location /`, which inherits it.
    add_header Referrer-Policy "no-referrer" always;

    # Long-cache the hashed build assets.
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
