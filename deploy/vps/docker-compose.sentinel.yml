# Sentinel cloud overlay for the ibbf VPS (Traefik + Let's Encrypt already running).
# Pulls prebuilt images from GHCR (CI builds them). Additive — does not touch the
# church app (ibbf.life / api.ibbf.life).
#
#   sentinel-postgres  — dedicated pgvector DB
#   sentinel-control   — cloud API/backend at control.thesentinels.online (auth, RBAC,
#                        tenant-scoped domain APIs, /config/cameras [box-token gated])
#   sentinel-app       — the web client (SPA) at app.thesentinels.online
#   sentinel-gateway   — public streaming bridge (live.view-gated) at
#                        gateway.thesentinels.online (+ legacy gateway.ibbf.life)
#
# Secrets live in /ibbf/sentinel.env on the VPS (NOT committed):
#   JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MASTER_EMAIL, MASTER_PASSWORD
# Face recognition runs in-cluster on the CPU sidecar (sentinel-ai, below); control
# reaches it at http://sentinel-ai:8000/runsync — no external key, set in-compose.
# Placeholders filled on the VPS: __DB_PASS__, __EDGE_HOST__, __EDGE_TS_IP__
services:
  sentinel-postgres:
    image: pgvector/pgvector:pg17
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: __DB_PASS__
      POSTGRES_DB: sentinel
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-redis:
    # Shared event fabric (pub/sub only — no persistence). Carries flow run-progress events
    # (multi-pod SSE relay) + edge-originated motion events. Internal only; no published port.
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-control:
    image: ghcr.io/jackesdavid/sentinel-control:latest
    container_name: sentinel-control
    restart: always
    env_file:
      # JWT_SECRET, GOOGLE_*, MASTER_*; ANTHROPIC_API_KEY (assistant chat — shared with flow);
      # ELEVENLABS_API_KEY (+ optional ELEVENLABS_VOICE_ID/MODEL_ID) for assistant TTS/STT.
      - sentinel.env
    environment:
      DATABASE_URL: postgres://sentinel:__DB_PASS__@sentinel-postgres:5432/sentinel
      REDIS_URL: redis://sentinel-redis:6379
      CONTROL_BIND: 0.0.0.0:8790
      OAUTH_REDIRECT_BASE: https://control.thesentinels.online
      OAUTH_SUCCESS_REDIRECT: https://app.thesentinels.online/login
      EDGE_DIST_DIR: /edge-dist
      LATEST_EDGE_VERSION: "0.1.3"
      # Face recognition sidecar (CPU, in-cluster). No key needed on the private network.
      AI_SERVICE_URL: http://sentinel-ai:8000/runsync
      # The workflow engine — control proxies Run / run-state / the SSE event relay to it.
      FLOW_URL: http://sentinel-flow:8787
    volumes:
      # Edge appliance binaries (shipped here by the release CI) served at /edge/<asset>.
      - /ibbf/edge-dist:/edge-dist:ro
    depends_on:
      sentinel-postgres:
        condition: service_healthy
      sentinel-ai:
        condition: service_started
      sentinel-redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-control.rule=Host(`control.thesentinels.online`)"
      - "traefik.http.routers.sentinel-control.entrypoints=websecure"
      - "traefik.http.routers.sentinel-control.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-control.loadbalancer.server.port=8790"

  sentinel-ai:
    # CPU, face-only vision sidecar (SCRFD detect + ArcFace embed). Internal only —
    # no Traefik labels, no published ports; only sentinel-control talks to it over the
    # compose network. Serves the same /runsync contract as RunPod (RunPod's local API
    # server). Built by .github/workflows/ai-sidecar.yml (tag: cpu).
    image: ghcr.io/jackesdavid/sentinel-ai:cpu
    container_name: sentinel-ai
    restart: always
    command: ["python", "-u", "handler.py", "--rp_serve_api", "--rp_api_host", "0.0.0.0", "--rp_api_port", "8000"]

  sentinel-ai-dlib:
    # A/B experiment: dlib / face_recognition variant, same /runsync contract + op names
    # (128-d embeddings, NOT compatible with the 512-d pgvector column). Internal only.
    # Behind the "experiment" profile so normal `up`/deploys NEVER start it. To run the
    # A/B: docker compose --profile experiment up -d sentinel-ai-dlib, then bench.py.
    profiles: ["experiment"]
    image: ghcr.io/jackesdavid/sentinel-ai:dlib
    container_name: sentinel-ai-dlib
    restart: unless-stopped
    command: ["python", "-u", "handler_dlib.py", "--rp_serve_api", "--rp_api_host", "0.0.0.0", "--rp_api_port", "8000"]

  sentinel-app:
    image: ghcr.io/jackesdavid/sentinel-app:latest
    container_name: sentinel-app
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-app.rule=Host(`app.thesentinels.online`)"
      - "traefik.http.routers.sentinel-app.entrypoints=websecure"
      - "traefik.http.routers.sentinel-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-app.loadbalancer.server.port=80"

  sentinel-landing:
    image: ghcr.io/jackesdavid/sentinel-landing:latest
    container_name: sentinel-landing
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-landing.rule=Host(`thesentinels.online`)"
      - "traefik.http.routers.sentinel-landing.entrypoints=websecure"
      - "traefik.http.routers.sentinel-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-landing.loadbalancer.server.port=80"

  sentinel-gateway:
    image: ghcr.io/jackesdavid/sentinel-gateway:latest
    container_name: sentinel-gateway
    restart: always
    env_file:
      - sentinel.env   # JWT_SECRET (shared with control — verifies live.view)
    environment:
      GATEWAY_BIND: 0.0.0.0:8789
      # The edge's go2rtc over the tailnet (TLS via the edge's MagicDNS cert).
      EDGE_UPSTREAM: https://__EDGE_HOST__
      # Internal control lookup for the tenant's box upstream (/internal/box-upstream).
      CONTROL_URL: http://sentinel-control:8790
    extra_hosts:
      - "__EDGE_HOST__:__EDGE_TS_IP__"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-gw.rule=Host(`gateway.thesentinels.online`) || Host(`gateway.ibbf.life`)"
      - "traefik.http.routers.sentinel-gw.entrypoints=websecure"
      - "traefik.http.routers.sentinel-gw.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-gw.loadbalancer.server.port=8789"

  sentinel-flow:
    # The always-on, MULTI-TENANT workflow engine + trigger poller. Internal only (no
    # Traefik — its REST is unauthenticated; the poller fires Cron/OnNewAlert + event
    # workflows for every tenant on its own). Each run resolves its tenant's edge go2rtc
    # from the box registry (tenant_boxes.magicdns_host) and grabs frames bound to that
    # edge; face recognition uses the in-cluster CPU sidecar.
    #
    # Scaling: `docker compose ... up -d --scale sentinel-flow=N` (or `task flow-scale N`).
    # No container_name — required so multiple replicas can coexist. Each replica gets a
    # unique HOSTNAME (Docker-assigned container ID) which the engine uses as pod_name.
    # Docker's internal DNS round-robins across all replicas; control's FLOW_URL resolves
    # to whichever pod is next in the rotation — no extra proxy needed.
    image: ghcr.io/jackesdavid/sentinel-flow:latest
    restart: always
    env_file:
      - sentinel.env   # TELEGRAM_* fallback, etc.
    environment:
      DATABASE_URL: postgres://sentinel:__DB_PASS__@sentinel-postgres:5432/sentinel
      REDIS_URL: redis://sentinel-redis:6379
      FLOW_BIND: 0.0.0.0:8787
      AI_SERVICE_URL: http://sentinel-ai:8000/runsync
      # FALLBACK go2rtc base for a tenant with no resolved box host. Per-tenant edges are
      # resolved from the registry at run time; reaching ARBITRARY tenant edges needs the
      # pod on the tailnet (deferred) — until then the single edge below is reachable.
      GO2RTC_URL: https://__EDGE_HOST__
    extra_hosts:
      - "__EDGE_HOST__:__EDGE_TS_IP__"
    depends_on:
      sentinel-postgres:
        condition: service_healthy
      sentinel-ai:
        condition: service_started
      sentinel-redis:
        condition: service_started
    deploy:
      replicas: 1   # increase with `task flow-scale N` — no redeploy needed

volumes:
  sentinel_pgdata:
