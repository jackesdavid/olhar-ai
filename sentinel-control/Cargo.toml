[package]
name = "sentinel-control"
version = "0.1.0"
edition = "2021"
description = "The control plane. Owns the central source of truth (cameras now; tenants, boxes, enrollment broker later) and serves it to edge appliances so they can be config-light — no Postgres on the box. Keeps the streaming gateway thin (media only)."

# Standalone crate (NOT in the app/ workspace). Links app-core for the device model +
# the shared Db.
[dependencies]
app-core = { path = "../crates/app-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
# Stream sentinel-flow's SSE through to browser clients (workflow run progress relay).
tokio-stream = "0.1"
futures = "0.3"

# Auth + tenancy: own async pool for users/tenants/roles (separate from app-core's Db,
# so queries run on this service's runtime), JWT sessions, argon2 password hashing.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "chrono",
] }
jsonwebtoken = "9"
hmac = "0.12"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Social login (Google now; Apple later) — hand-rolled OAuth2 code flow over reqwest.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
urlencoding = "2"
# FIDO2 / WebAuthn passkey login (card #147, security plan §2).
# `conditional-ui` gates the discoverable-credential API (start/identify/finish_discoverable_
# authentication) — what makes usernameless "sign in with a passkey" possible. webauthn-rs
# lists it under preview-features, so treat it as a moving target on upgrades.
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode base64 face images posted to the enrollment / recognize endpoints.
base64 = "0.22"
# Hash box tokens (sha256) for deterministic lookup; never store the plaintext.
sha2 = "0.10"
hex = "0.4"
log = "0.4"
tracing = "0.1"
env_logger = "0.11"
# Event fabric is Postgres LISTEN/NOTIFY now (card #147) — the SSE relay LISTENs on 'workflow_events'
# (every flow pod notifies it). Edge-motion triggers already ride the durable Postgres event_queue.
