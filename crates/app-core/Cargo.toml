[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
description = "Bishop's UI-agnostic logic, copied for the web app (parallel to the ratatui src/)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ONVIF camera support (copied from the ratatui src/onvif): blocking HTTP +
# WS-Security PasswordDigest + WS-Discovery UUIDs.
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
# RTSP digest auth (rtsp_probe) — cameras challenge with MD5 digest.
md-5 = "0.10"
# Stripe webhook signature verification: HMAC-SHA256 over the raw request body.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
# IANA-timezone-aware datetime math for scheduled workflow triggers (#111) — DST-correct
# "next occurrence" in a graph's timezone. Not a sqlx feature (timestamps stay RFC3339 text).
chrono-tz = "0.9"
# Agent vision + chat snapshots: decode/re-encode camera frames to bounded JPEG
# (copied from the ratatui src/agent). JPEG-only to keep the build lean.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Text rendering for the Draw Text workflow node (glyph rasterization + filled-rect background).
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
# Native person detection: YOLOX-Nano (Apache-2.0) run in-process with `tract`, a
# pure-Rust ONNX engine — no native ONNX Runtime to compile or bundle, builds the
# same on every target (ort ships no prebuilt ORT for x86_64 macOS). We use tract's
# re-exported `tract_ndarray` to build the input tensor so the versions can't drift.
tract-onnx = "0.23"
# Postgres persistence (devices module). We use runtime queries (`query_as` + FromRow),
# NOT the compile-checked `query!` macro, so the build needs no live DB / DATABASE_URL.
# rustls TLS keeps the build pure-Rust (no OpenSSL); the Db wraps its own tokio runtime
# so the otherwise-synchronous command/tool code can call sqlx without going async.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
# S3-compatible object store (minio) for notification media (snapshot JPEGs, recording mp4s).
# Blocking API + rustls (pure-Rust, no OpenSSL) — called from the sync enqueue/consumer paths.
rust-s3 = { version = "0.35", default-features = false, features = ["blocking", "tokio-rustls-tls"] }

# Linked gstreamer-rs for the cold RTSP snapshot (card #138, touchpoint A5). OPTIONAL and OFF by
# default: app-core is compiled into the CLOUD services (control/flow) too, and they neither have
# nor want a GStreamer runtime. The edge turns it on by forwarding its own `gst-linked` feature.
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }

[features]
gst-linked = ["dep:gstreamer", "dep:gstreamer-app"]
