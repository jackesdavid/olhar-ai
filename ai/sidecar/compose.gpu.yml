# Run the Sentinel AI sidecar on a local Linux box with an NVIDIA GPU (e.g. RTX 2060).
#
# Prereqs on the Linux box: Docker + the NVIDIA driver + nvidia-container-toolkit
# (so the container can see the GPU — `nvidia-smi` should work on the host).
#
#   cd ai/sidecar
#   docker compose -f compose.gpu.yml up --build
#
# It serves the SAME /runsync contract as RunPod at  http://<this-box-lan-ip>:8000.
# Then on the Mac app, set in the repo-root .env:
#   AI_SERVICE_URL=http://<this-box-lan-ip>:8000/runsync
#   AI_SERVICE_KEY=
# and enrollment/recognition run on this box's GPU.
services:
  ai:
    # Build the image right here on the box (native amd64 + the local GPU — fast, no
    # registry needed). To use the CI-built image instead, comment out `build: .`
    # and set `image: ghcr.io/jackesdavid/sentinel-ai:gpu` (then `docker login ghcr.io`).
    build: .
    image: sentinel-ai:gpu
    ports:
      - "8000:8000"
    # RunPod's built-in local HTTP server (identical /runsync contract to production),
    # bound to 0.0.0.0 so other machines on the LAN can reach it.
    command: ["python", "-u", "handler.py", "--rp_serve_api", "--rp_api_host", "0.0.0.0", "--rp_api_port", "8000"]
    restart: unless-stopped
    # Pass the GPU through (Compose honours this device reservation for `docker compose up`).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
