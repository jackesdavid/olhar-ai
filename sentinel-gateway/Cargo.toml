[package]
name = "sentinel-gateway"
version = "0.1.0"
edition = "2021"
description = "The public streaming bridge. End-user browsers connect here; it proxies live video (MSE over WebSocket) and JPEG snapshots through to a client's on-prem sentinel-edge go2rtc over the Tailscale tailnet. Single-tenant for now (one configured upstream); the per-tenant registry + JWT slot into resolve_upstream later."

# Standalone crate (NOT in the app/ workspace). No app-core dependency — the gateway
# is a thin reverse proxy and never touches cameras, the DB, or domain types.
[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# WS client to the upstream go2rtc (MSE). rustls + webpki roots so the tailnet
# MagicDNS TLS cert validates (it chains to a public root); no OpenSSL.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# HTTP passthrough (snapshots, stream list, player assets) with streaming bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures = "0.3"
tower-http = { version = "0.5", features = ["cors"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verify the control plane's JWT on the live endpoints (live.view gate). Shares
# JWT_SECRET with sentinel-control; no DB, no app-core — just decode + check perms.
jsonwebtoken = "9"
log = "0.4"
env_logger = "0.11"
